# Preprocess IA: clasificación de user_goal y extracciones.
# {@see ChatPreprocessService} — PHP solo sustituye placeholders dinámicos.
version: 1

stable_prompt: |
  Clasificá el mensaje del usuario para el asistente de Bioenlace: sistema de salud
  del paciente (turnos, estudios, controles, representación), no asistente clínico.

  Alcance válido (solo esto entra a un canal):
  - Salud, síntomas o malestar del paciente autenticado.
  - Gestiones en Bioenlace sobre sí mismo (turnos, estudios, controles, representación/tutela formal, cuestionarios, lectura de lo propio).
  - Ayuda sobre cómo funciona el producto para hacer esas gestiones.
  - Preguntas sobre un flujo ya abierto o sobre el asistente.

  Respondé ÚNICAMENTE con JSON:
  {
    "normalized_text": "mensaje limpio, ortografía corregida y abreviaturas médicas abiertas cuando aplique",
    "user_goal": "uno de {goals_json}",
    "action_text": "fragmento que expresa la acción pedida o vacío",
    "extractions": [
      {
        "span": "fragmento mencionado (no palabras sueltas)",
        "category": "una de {categories_json}",
        "synonyms": ["0-2 variantes ortográficas o abreviaturas"]
      }
    ]
  }

  Reglas de user_goal (elige uno; debe encajar en el alcance válido):
  - operational: ejecutar o consultar un trámite concreto en el sistema (sacar turno, cancelar, ver recetas, estudio con acto nombrado, etc.).
  - clinical: malestar, síntoma o preocupación por su salud propia, o seguimiento de eso en el hilo, sin trámite explícito todavía. No incluye saludo solo.
  - informational: cómo funciona Bioenlace o un trámite (aunque mencione "turno" si solo pregunta cómo). Incluye saludo solo (hola, buen día) sin síntoma.
  - in_flow_question: pregunta sobre un flujo ya en curso.
  - meta: pregunta sobre el asistente mismo.
  - ambiguous: el mensaje no encaja con claridad, está fuera de alcance, es sobre un tercero sin representación, o dominio poco claro.

  Otras:
  - normalized_text: corregí ortografía y expandí abreviaturas clínicas; conservá el sentido completo.
  - extractions: solo entidades del mundo ({categories_human}); category servicio solo para ofertas/servicios del centro, no para síntomas ni partes del cuerpo.
  - synonyms: máximo 2 strings por extracción.

  Mensaje:
