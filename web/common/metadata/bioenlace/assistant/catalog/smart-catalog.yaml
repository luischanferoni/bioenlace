# Catálogo inteligente del asistente — triggers → tools ejecutables.
# Schema: assistant/schemas/smart-catalog-entry-v1.yaml
# Frontera A/B/C: .cursor/rules/asistente-intents-frontera-sin-solape.mdc
version: 1

entries:
  - id: atencion-sintoma
    # Charla + CTA (no abrir triage solo por “me duele”).
    match_only: true
    routing_result: incompletas
    priority: 90
    triggers:
      tags: [sintoma, dolor, malestar, necesito_atencion, medicamento]
      phrases:
        - me duele
        - me molesta
        - me siento mal
        - necesito atencion
        - necesito atención
        - efecto adverso
        - efectos adversos
        - me cayo mal
        - me cayó mal
        - reaccion al medicamento
        - reacción al medicamento
      keywords: [panza, cabeza, fiebre, vomito, vómito]
    cta_intent_ids:
      - atencion.necesito-atencion

  - id: atencion-estudio
    tool_type: intent
    tool_ref: atencion.necesito-atencion
    routing_result: clara
    priority: 92
    triggers:
      tags: [estudio, pedido_estudio, acto_clinico]
      phrases:
        - necesito una ecografia
        - necesito una ecografía
        - necesito una mamografia
        - necesito una mamografía
        - necesito un estudio
        - sacar turno para estudio
        - turno para ecografia
        - turno para ecografía
        - turno para mamografia
        - turno para mamografía
        - turno para laboratorio
        - turno para analisis
        - turno para análisis
        - analisis de sangre
        - análisis de sangre

  - id: atencion-control
    tool_type: intent
    tool_ref: atencion.necesito-atencion
    routing_result: clara
    priority: 91
    triggers:
      tags: [control, seguimiento]
      phrases:
        - controlar la diabetes
        - control de seguimiento
        - renovar medicacion
        - renovar medicación
        - consulta por mensaje
        - consulta clinica por mensaje
        - consulta clínica por mensaje
        - pedir un control

  # Zona C: pedido de agenda sin destino → incompletas + CTAs (no lanzar flow).
  - id: agenda-pedido-sin-destino
    match_only: true
    routing_result: incompletas
    priority: 88
    triggers:
      tags: [pedido_turno_sin_destino]
      context_areas: [appointments]
    cta_intent_ids:
      - turnos.crear-como-paciente
      - atencion.necesito-atencion

  # Zona A: ya hay oferta/profesional → agenda pura.
  - id: turnos-crear
    tool_type: intent
    tool_ref: turnos.crear-como-paciente
    routing_result: clara
    priority: 85
    triggers:
      tags: [sacar_turno]
      phrases:
        - turno con
        - turno en
        - cita con
        - cita en
        - turno para mi
        - solicita un turno para mi
      context_areas: [appointments]

  - id: turnos-cancelar-paciente
    tool_type: intent
    tool_ref: turnos.cancelar-como-paciente-flow
    routing_result: clara
    priority: 87
    triggers:
      tags: [cancelar_turno]
      phrases:
        - cancelar turno
        - cancela el turno
        - anular turno
        - dar de baja turno
        - no puedo ir al turno
      context_areas: [appointments]

  - id: laboratorio-mis-resultados
    tool_type: intent
    tool_ref: laboratorio.ver-resultados-como-paciente
    routing_result: clara
    priority: 86
    triggers:
      tags: [mis_analisis]
      phrases:
        - mis analisis
        - mis resultados
        - resultados de laboratorio
        - informes de laboratorio
        - ver mis estudios
      context_areas: [diagnostics]

  - id: turnos-ver-paciente
    tool_type: intent
    tool_ref: turnos.ver-mis-turnos-como-paciente
    routing_result: clara
    priority: 80
    triggers:
      tags: [mis_turnos, ver_turnos]
      phrases:
        - mis turnos
        - cuales son mis turnos
        - cuáles son mis turnos
        - que turnos tengo
        - qué turnos tengo
        - próximo turno
        - proximo turno
        - mis citas
        - turnos pendientes
      context_areas: [appointments]

  - id: turnos-ultimo-en-oferta
    tool_type: intent
    tool_ref: turnos.ver-ultimo-en-oferta-como-paciente
    routing_result: clara
    priority: 78
    triggers:
      tags: [ultima_vez_oferta]
      phrases:
        - ultima vez que fui
        - última vez que fui
        - cuando fui al
        - cuándo fui al
        - ultima vez al dentista
        - última vez al dentista
        - cuando fue la ultima vez
        - cuándo fue la última vez
      context_areas: [appointments]

  - id: llegar-tarde-politicas
    tool_type: aspect
    tool_ref: site.appointment.policies
    routing_result: incompletas
    priority: 75
    triggers:
      tags: [llegar_tarde, tolerancia]
      phrases: [llego tarde, llegar tarde, me esperan, voy tarde, minutos tarde]
      context_areas: [appointments]

  - id: llegar-tarde-cita-actual
    tool_type: aspect
    tool_ref: appointment.current
    routing_result: incompletas
    priority: 70
    triggers:
      tags: [llegar_tarde]
      phrases: [llego tarde, llegar tarde, voy tarde, mi turno, mi cita]
      context_areas: [appointments]
    required_anchors: [subject_persona]

  - id: articulo-representacion
    tool_type: article
    tool_ref: representacion
    routing_result: clara
    priority: 85
    triggers:
      tags: [representacion, tutela, representante]
      phrases: [representacion, representación, operar por mi hijo, vincular menor, designar representante, tutor]
      context_areas: [representation]
      keywords: [sobrino, sobrina, hijo, hija, menor, tutela]

  - id: fuera-his-servicios-inexistentes
    match_only: true
    routing_result: fuera_de_his
    priority: 10
    triggers:
      tags: [fuera_his]
      phrases: [medium, sesion con una medium, clima, chiste, horoscopo, horóscopo]

  - id: profesionales-listado-staff
    tool_type: intent
    tool_ref: profesionales.listado-efector
    routing_result: clara
    priority: 70
    triggers:
      tags: [listar_profesionales, staff]
      phrases: [listar profesionales, profesionales del centro, medicos del centro, médicos del centro]
      context_areas: [geo_resources]
