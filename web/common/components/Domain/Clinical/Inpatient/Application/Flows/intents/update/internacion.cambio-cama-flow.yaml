intent_id: internacion.cambio-cama-flow
version: 1
shortcut:
  hidden: true
action_name: 'Cambio de cama'
rbac_route: /api/clinical/episode-of-care/by-internacion

initial: cambiar_cama
states:
  cambiar_cama:
    label: 'Seleccioná la cama destino y el motivo'
    description: 'Cama destino y motivo del cambio'
    meta:
      requires:
        - draft.internacion_id
      open_ui:
        action_id: clinical.internacion.cambio-cama-formulario
        params:
          internacion_id: draft.internacion_id
    type: final
flow_submit:
  action_id: clinical.internacion.cambio-cama-formulario
  params:
    internacion_id: draft.internacion_id
    id_cama: draft.id_cama
    motivo: draft.motivo

