# Tipo: routing
# Propósito: tags de hilo del asistente (dominio + certeza) desde user_goal.
# Consumidor: AssistantThreadStateService / ProductMetadataPaths::threadStateFile()
version: 1

goal_to_thread_tag:
  guide: guide
  operational: operational
  in_flow_question: operational
  ambiguous: ambiguous

certainty:
  symptom_confidence: 0.85
  followup_delta: 0.15
  cta_threshold: 0.7
  confidence_min: 0.0
  confidence_max: 1.0

diversion:
  force_ambiguous: true
  ignore_from_tags:
    - ambiguous
    - ''
  ignore_to_tags:
    - ambiguous
    - operational
