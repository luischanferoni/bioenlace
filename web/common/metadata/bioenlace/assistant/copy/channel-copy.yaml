# Tipo: copy
# Propósito: textos UX del asistente por canal/perfil de cliente.
# Consumidor: AssistantChannelCopy / ProductMetadataPaths::assistantChannelCopyFile()
# No poner aquí: predicados de canal (ChatChannelPolicy) ni intent_id en motores.
#
# profile_id = clave de sección en client-context.yaml que matchea X-App-Client
# (mobile_paciente, whatsapp_paciente, …) o `default`.
#
# Placeholders opcionales entre llaves: {url}, {label}
version: 1

messages:
  no_intent_match:
    default: "No encontré una opción que encaje claramente con tu pedido."
    whatsapp_paciente: "No entendí del todo tu pedido. Escribí menú o probá con: mis turnos, cancelar un turno, ver laboratorio, ver recetas."

  available_options_intro:
    default: "Estas son algunas opciones disponibles para vos."
    whatsapp_paciente: "Estas son algunas opciones:"

  open_ui_button:
    default: "Abrir"
    whatsapp_paciente: "Ver en la app"
    mobile_paciente: "Abrir"

  open_ui_deep_link_suffix:
    default: ""
    whatsapp_paciente: "\n\nTambién podés verlo en la app: {url}"

  interactive_pick_one:
    default: "Elegí una opción"

  # Vacío a propósito: el texto del offer ya menciona el botón; el hint era redundante.
  interactive_buttons_hint_one:
    default: ""
    whatsapp_paciente: ""

  interactive_buttons_hint_many:
    default: ""
    whatsapp_paciente: ""

  # Match PHP 100% → flow (sin 2ª IA). Placeholders: {necesidad} {label} {summary} {spans}
  full_match_intent:
    default: "{necesidad}"
    whatsapp_paciente: "{necesidad}"

  full_match_intent_summary:
    default: "{summary}"

  full_match_intent_fallback:
    default: "Te ayudo con {label}."
    whatsapp_paciente: "Dale, vamos con {label}."
