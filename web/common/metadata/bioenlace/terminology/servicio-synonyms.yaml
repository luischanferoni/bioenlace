# Sinónimos coloquiales → nombre institucional de servicios de salud.
# Usado por HintEntityMatcher para resolver menciones del paciente
# (ej. "dentista" → matchea "ODONTOLOGIA").
#
# Cada clave es el nombre normalizado (lowercase, sin tildes) del servicio
# en la BD. Los valores son alias coloquiales que el paciente podría usar.
# El matcher enriquece los terms del usuario con estos alias inversos.
#
# {@see HintServiceSynonyms}
