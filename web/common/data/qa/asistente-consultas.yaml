  - id: guide-cadena-evolucion
    seccion: orientacion
    tipo: Evolución
    cobertura: Hoy
    mensajes:
      - Tengo fiebre, tos…
      - Empezó ayer y se me fue poniendo peor
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: guide-pedir-que-hacer
    seccion: orientacion
    tipo: Pedir qué hacer
    cobertura: Hoy
    mensajes:
      - Me duele la panza
