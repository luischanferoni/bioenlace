intent_id: laboratorio.ver-resultados-como-paciente
version: 1
action_name: 'Ver resultados de laboratorio'
rbac_route: /api/clinical/laboratory-result/mis-resultados-como-paciente
keywords:
  # Evitar tokens sueltos laboratorio/estudios/análisis (pelean con pedir estudio).
  - 'mis resultados'
  - 'mis análisis'
  - 'informes de laboratorio'
  - 'resultados de laboratorio'
  - 'ver mis estudios'
intent_semantics:
  objective: 'Consultá tus informes de laboratorio sincronizados, con detalle y descarga PDF.'
initial: ver_listado
states:
  ver_listado:
    description: 'Elegí un informe de laboratorio'
    meta:
      provides:
        - draft.report_id
      open_ui:
        action_id: clinical.laboratory-result.mis-resultados-como-paciente
    always: ver_detalle
  ver_detalle:
    description: 'Detalle del informe'
    meta:
      requires:
        - draft.report_id
      open_ui:
        action_id: clinical.laboratory-result.ver-informe-como-paciente
        params:
          report_id: draft.report_id
    type: final
