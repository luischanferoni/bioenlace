intent_id: profesional-horarios.gestionar-propio
version: 1
operation: edit
intent_family: profesional-horarios.gestionar
domain_operation: DataAccess.edit
action_name: 'Configurar mis horarios (ambulatorio / guardia / internación)'
rbac_route: /api/profesional-horarios/gestionar
keywords:
  - 'mis horarios'
  - 'configurar mis horarios'
  - 'mi agenda'
  - 'modificar mi agenda'
  - 'editar mi agenda'
  - 'configurar mi agenda'
  - 'configurar mi agenda ambulatoria'
  - 'modificar horarios propios'
  - 'horario de piso'
  - 'horario de internación'
  - 'cargar horario de guardia'
  - 'horario de guardia'
  - 'plantel de guardia'
  - 'agenda ambulatoria'
  - 'configurar agenda'
intent_semantics:
  objective: 'Configurar horarios propios según la clase de encuentro (AMB cupos, EMER/IMP horario semanal).'
draft_hydrator:
  handler: organization.pes_from_servicio
  require_own_pes: true
initial: select_servicio
states:
  select_servicio:
    description: 'Elegí el servicio'
    meta:
      provides:
        - draft.id_servicio
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: profesional-efector-servicio.listar-mis-servicios-en-efector
        params:
          incluir_sin_agenda: '1'
    always: select_encounter_class
  select_encounter_class:
    description: '¿Ambulatorio, guardia o internación?'
    meta:
      provides:
        - draft.encounter_class
      requires:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: profesional-horarios.elegir-encounter-class
    always: configurar_horario
  configurar_horario:
    description: 'Configurá tus horarios'
    meta:
      provides:
        - draft.horario_ui_completed
      requires:
        - draft.id_profesional_efector_servicio
        - draft.encounter_class
      open_ui_routing:
        -
          when:
            draft_equals:
              encounter_class: AMB
          open_ui:
            action_id: profesional-agenda.configurar-agenda
            params:
              id_profesional_efector_servicio: draft.id_profesional_efector_servicio
              id_servicio: draft.id_servicio
              ui_step: datos
        -
          when:
            default: true
          open_ui:
            action_id: profesional-horarios.gestionar
            params:
              modo: propio
              id_profesional_efector_servicio: draft.id_profesional_efector_servicio
              id_servicio: draft.id_servicio
              encounter_class: draft.encounter_class
    type: final
