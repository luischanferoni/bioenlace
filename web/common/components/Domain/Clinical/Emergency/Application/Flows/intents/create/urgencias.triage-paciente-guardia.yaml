intent_id: urgencias.triage-paciente-guardia
version: 1
action_name: 'Triage en guardia'
rbac_route: /api/home/panel

initial: elegir_paciente
states:
  elegir_paciente:
    label: Elegí el paciente en guardia pendiente de triage
    description: 'Paciente en guardia pendiente de triage'
    explanation: 'La persona elige paciente en guardia pendiente de triage.'
    meta:
      tags:
        - triage
        - guardia_staff
        - paciente_guardia
        - prioridad
      provides:
        - draft.guardia_id
      open_ui:
        action_id: clinical.emergency-guardia.elegir-paciente-triage
    always: registrar_triage
  registrar_triage:
    label: 'Completá nivel (1–5), motivo y signos vitales si corresponde'
    description: 'Nivel de triage, motivo y signos vitales'
    explanation: 'La persona elige nivel de triage, motivo y signos vitales.'
    meta:
      tags:
        - triage
        - signos
        - vitales
        - nivel
      requires:
        - draft.guardia_id
      open_ui:
        action_id: clinical.emergency-guardia.registrar-triage-formulario
        params:
          guardia_id: draft.guardia_id
    outcome: 'Termina cuando la persona registra el triage.'
    type: final
flow_submit:
  action_id: clinical.emergency-guardia.registrar-triage-formulario
  params:
    guardia_id: draft.guardia_id
    level: draft.level
    reason_text: draft.reason_text
    bp_sys: draft.bp_sys
    bp_dia: draft.bp_dia
    hr: draft.hr

