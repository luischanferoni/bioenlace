intent_id: turnos.crear-como-paciente
version: 4
action_name: 'Turno con un especialista'
rbac_route: /api/turnos/crear-como-paciente

context:
  - tipo_atencion
  - fecha_turno
initial: select_servicio
states:
  select_servicio:
    label: Elegir oferta del centro (servicio con agenda)
    description: 'Oferta del centro con agenda'
    meta:
      tags:
        - turno
        - solicitud
      provides:
        - draft.id_servicio_asignado
      open_ui:
        action_id: servicios.elegir-acepta-turnos
      hint:
        entity: servicio
        match_property: nombre
    always: select_efector
  select_efector:
    label: Elegir centro de salud (incluye cercanos en mapa)
    description: 'Centros de salud, incluidos los cercanos'
    meta:
      provides:
        - draft.id_efector
      requires:
        - draft.id_servicio_asignado
      chooser:
        when_user_says_nearby:
          open_ui:
            action_id: efectores.listar-por-servicio-cercano
            params:
              id_servicio: draft.id_servicio_asignado
        otherwise:
          open_ui:
            action_id: efectores.listar-por-servicio
            params:
              id_servicio: draft.id_servicio_asignado
      hint:
        entity: efector
        match_property: nombre
    always: select_profesional
  select_profesional:
    label: Elegir profesional (PES) de esa oferta en ese centro
    description: 'Profesional de esa oferta en ese centro'
    meta:
      provides:
        - draft.id_profesional_efector_servicio
      requires:
        - draft.id_efector
        - draft.id_servicio_asignado
      open_ui:
        action_id: profesional-efector-servicio.listar-por-efector-servicio-acepta-turnos
        params:
          id_efector: draft.id_efector
          id_servicio: draft.id_servicio_asignado
      hint:
        entity: profesional
        match_property: nombre
    always: select_dia
  select_dia:
    label: Elegir día con cupos disponibles
    description: 'Día con cupos'
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: turnos.slots-dias-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    always: select_slot
  select_slot:
    label: Elegir horario (slot) para cerrar la reserva
    description: 'Horario para reservar el turno'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id_profesional_efector_servicio
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          fecha: draft.fecha_turno
    type: final
flow_submit:
  action_id: turnos.crear-como-paciente
  params:
    slot_id: draft.slot_id
    id_servicio_asignado: draft.id_servicio_asignado
    id_efector: draft.id_efector
    tipo_atencion: draft.tipo_atencion

