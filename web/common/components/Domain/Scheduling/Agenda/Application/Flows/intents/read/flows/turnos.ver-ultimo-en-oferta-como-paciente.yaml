intent_id: turnos.ver-ultimo-en-oferta-como-paciente
version: 1
action_name: 'Última vez en un servicio'
rbac_route: /api/turnos/listar-como-paciente

intent_semantics:
  objective: 'Consultá cuándo fue tu último turno en un área del centro (la que nombraste o, si no se cruza, tus últimos turnos).'
draft_hydrator:
  handler: scheduling.turnos_listar_como_paciente
  alcance: pasados
  limit: 10
  solo_ultimo: true
  filtro_oferta_desde_mensaje: true
initial: ver_ultimo
states:
  ver_ultimo:
    description: 'Tu último turno en esa oferta'
    meta:
      tags:
        - ultima_vez
      open_ui:
        action_id: turnos.listar-como-paciente
        params:
          alcance: pasados
          limit: '5'
      hint:
        entity: servicio
        match_property: nombre
    type: final

