intent_id: servicio-teleconsulta.configurar-efector-flow
version: 1
domain_operation: ServicioTeleconsultaPolitica.configurar
action_name: 'Política de teleconsulta por servicio'
rbac_route: /api/home/panel

guide:
  funcionalidad: 'Permite al staff configurar la política de teleconsulta por servicio del efector. El flujo permite seleccionar el servicio y definir si habilita videollamada y para qué casos. El resultado final es la política de teleconsulta del servicio configurada.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Política de teleconsulta configurada para el servicio.
    - Definición de casos habilitados para videollamada.

initial: configurar_politica
states:
  configurar_politica:
    label: Elegí servicio y política de videollamada
    description: 'Servicio y política de videollamada'
    explanation: 'La persona elige servicio y política de videollamada.'
    meta:
      tags:
        - videollamada_politica
        - teleconsulta_staff
        - habilitar
        - modalidad_staff
      provides:
        - draft.id_servicio
        - draft.teleconsulta_politica
        - draft.caso_codigos_text
      open_ui:
        action_id: servicio-teleconsulta.configurar
    outcome: 'Termina cuando la persona define la política de videollamada del servicio.'
    type: final
flow_submit:
  action_id: servicio-teleconsulta.configurar
  params:
    id_servicio: draft.id_servicio
    teleconsulta_politica: draft.teleconsulta_politica
    caso_codigos_text: draft.caso_codigos_text

