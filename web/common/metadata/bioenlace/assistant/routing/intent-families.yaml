# Tipo: routing
# Propósito: familias NL (variantes propio/staff del mismo eje de producto).
# Consumidor: IntentFamilyCatalog / ProductMetadataPaths::intentFamiliesFile()
# No poner aquí: keywords de un intent concreto (van en intents/**/*.yaml).
version: 1

# Cada miembro debe declarar intent_family y operation coherentes en su YAML.

families:
  condicion-laboral.edit:
    operation: edit
    members:
      - condicion-laboral.editar-propio
      - condicion-laboral.editar-staff

  profesionales.conteo-efector:
    operation: info
    members:
      - profesionales.conteo-efector

  profesionales.listado-efector:
    operation: list
    members:
      - profesionales.listado-efector

  profesionales.distribucion-servicio-efector:
    operation: info
    members:
      - profesionales.distribucion-servicio-efector

  profesional-agenda.configurar:
    operation: edit
    members:
      - profesional-agenda.configurar-staff

  profesional-horarios.gestionar:
    operation: edit
    members:
      - profesional-horarios.gestionar-propio
      - profesional-horarios.gestionar-staff

  profesional-identidad.editar:
    operation: edit
    members:
      - profesional-identidad.editar-staff
