intent_id: turnos.reubicar-como-paciente-flow
version: 1
action_name: 'Reubicar turno'
rbac_route: /api/turnos/reubicar-como-paciente

context:
  - id_servicio_asignado
  - id_efector
  - id_profesional_efector_servicio
  - fecha_turno
initial: select_turno
states:
  select_turno:
    label: Turno a reubicar
    description: 'Turno que hay que reubicar'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-en-resolucion-como-paciente
    always: select_servicio
  select_servicio:
    label: Servicio
    description: 'Servicio para el nuevo turno'
    meta:
      provides:
        - draft.id_servicio_asignado
      open_ui:
        action_id: servicios.elegir-acepta-turnos
    always: select_efector
  select_efector:
    label: Centro de salud
    description: 'Centro para el nuevo turno'
    meta:
      provides:
        - draft.id_efector
      requires:
        - draft.id_servicio_asignado
      chooser:
        when_user_says_nearby:
          open_ui:
            action_id: efectores.listar-por-servicio-cercano
            params:
              id_servicio: draft.id_servicio_asignado
        otherwise:
          open_ui:
            action_id: efectores.listar-por-servicio
            params:
              id_servicio: draft.id_servicio_asignado
    always: select_profesional
  select_profesional:
    label: Profesional
    description: 'Profesional para el nuevo turno'
    meta:
      provides:
        - draft.id_profesional_efector_servicio
      requires:
        - draft.id_efector
        - draft.id_servicio_asignado
      open_ui:
        action_id: profesional-efector-servicio.listar-por-efector-servicio-acepta-turnos
        params:
          id_efector: draft.id_efector
          id_servicio: draft.id_servicio_asignado
    always: select_dia
  select_dia:
    label: Día
    description: 'Día con lugar para el nuevo turno'
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.id
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: turnos.slots-dias-reubicar-como-paciente
        params:
          id: draft.id
          id_efector: draft.id_efector
          id_servicio_asignado: draft.id_servicio_asignado
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          mismo_profesional: '0'
    always: select_slot
  select_slot:
    label: Horario
    description: 'Horario para el nuevo turno'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id
        - draft.id_profesional_efector_servicio
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-reubicar-como-paciente
        params:
          id: draft.id
          id_efector: draft.id_efector
          id_servicio_asignado: draft.id_servicio_asignado
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          fecha: draft.fecha_turno
          mismo_profesional: '0'
    type: final
flow_submit:
  action_id: turnos.reubicar-como-paciente
  params:
    id: draft.id
    slot_id: draft.slot_id
    id_efector: draft.id_efector
    id_servicio_asignado: draft.id_servicio_asignado

