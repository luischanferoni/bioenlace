# Contrato JSON — 1ª IA (etiquetado). Consumidor: ChatPreprocessService.
# ADR: web/docs/decisions/asistente-catalogo-inteligente.md
version: 2

description: >
  Respuesta exclusivamente JSON del preprocess. Mensaje + historial reciente en el prompt;
  sin catálogo de funcionalidades completo. Las áreas de contexto las deriva PHP
  del match (carpeta del intent), no la 1ª IA.

required:
  - normalized_text
  - necesidades_usuario
  - routing_hint
  - tags
  - extractions

fields:
  normalized_text:
    type: string
    notes: Ortografía corregida; sentido conservado.
  necesidad_usuario:
    type: string
    optional: true
    notes: >
      La deriva PHP: solo las oraciones con estado activa, una por línea.
      La 1ª IA no tiene que mandarla.
  necesidades_usuario:
    type: list<object>
    item_fields:
      expresion: string
      estado: enum
      estado_values: [activa, satisfecha, descartada]
    notes: >
      Una oración por necesidad (dónde, cómo, desde cuándo, para quién) y su estado.
      activa = lo quiere ahora y no se resolvió. satisfecha = ya se cumplió en el hilo.
      descartada = la dejó de lado o dijo que no. Un estado desconocido se descarta.
      Una oración suelta (sin objeto) cuenta como activa.
  routing_hint:
    type: enum
    values: catalog/preprocess-routing-hints.yaml
    notes: Lectura del mensaje (capa IA); PHP adjudica el path de decisión.
  tags:
    type: list<string>
    notes: >
      Las inventa la 1ª IA. PHP las cruza con meta.tags del estado.
      El estado que cruza dice, con hint.entity, qué padrón hidratar con el span.
  extractions:
    type: list<object>
    item_fields:
      span: string
      synonyms: list<string>
    notes: Máximo 2 synonyms por extracción. El span es el fragmento literal a buscar en el hint del estado.
  intent_ids_hint:
    type: list<string>
    optional: true
    deprecated: true
    notes: >
      No pedido al modelo en el prompt (sin catálogo de intents en contexto).
      PHP lo acepta si viene, valida contra RBAC y lo pasa al match;
      pero el scoring real viene de tags + phrases.
      Campo preservado por compat; no agregar al prompt.
  context_areas:
    type: list<string>
    optional: true
    deprecated: true
    notes: >
      Ignorado por PHP. Las áreas activas se derivan del match → intent → carpeta de dominio.
      No pedir al modelo.

example:
  normalized_text: "la ecografía sí, el turno de clínica ya lo saqué"
  necesidades_usuario:
    - expresion: "Ya sacó el turno de clínica."
      estado: satisfecha
    - expresion: "Quiere una ecografía."
      estado: activa
  routing_hint: pedido_claro
  tags: [estudio]
  extractions: []
  intent_ids_hint: []
