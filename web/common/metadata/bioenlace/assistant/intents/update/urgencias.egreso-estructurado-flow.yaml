intent_id: urgencias.egreso-estructurado-flow
version: 1

action_name: "Egreso de guardia"
description: "Cierre final del episodio: destino, diagnóstico y epicrisis, sin pedidos que retengan al paciente en guardia."
rbac_route: "/api/clinical/emergency-guardia/egreso-formulario"
keywords:
  - egreso guardia
  - alta guardia
  - epicrisis guardia
  - destino egreso
  - conducta guardia

intent_semantics:
  goal: >-
    Cerrar el episodio de guardia como encounter final (destino, diagnóstico operativo, epicrisis).
  how: >-
    Formulario UI con destino/conducta, epicrisis y checklist (incluye confirmar que no hay retención por pedidos).
  outcome:
    - El circuito de guardia queda cerrado con documentación de egreso.

subintents:
  - id: completar_egreso
    assistant_text: "Completá destino, epicrisis y checklist de egreso"
    requires:
      - draft.guardia_id
    provides: []
    next: ""
    open_ui:
      action_id: clinical.emergency-guardia.egreso-formulario
      params:
        guardia_id: "draft.guardia_id"

flow_submit:
  action_id: clinical.emergency-guardia.egreso-formulario
  params:
    guardia_id: "draft.guardia_id"
    fecha_fin: "draft.fecha_fin"
    hora_fin: "draft.hora_fin"
    destino_egreso: "draft.destino_egreso"
    diagnostico_operativo: "draft.diagnostico_operativo"
    epicrisis: "draft.epicrisis"
    pautas_alarma: "draft.pautas_alarma"
    id_efector_derivacion: "draft.id_efector_derivacion"
    condiciones_derivacion: "draft.condiciones_derivacion"
    checklist_indicaciones: "draft.checklist_indicaciones"
    checklist_epicrisis: "draft.checklist_epicrisis"
