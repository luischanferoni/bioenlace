intent_id: turnos.confirmar-asistencia-flow
version: 1
action_name: 'Confirmar asistencia al turno'
rbac_route: /api/turnos/confirmar-asistencia-como-paciente
keywords:
  - 'confirmar turno'
  - 'confirmar asistencia'
  - 'voy a ir'
  - 'asistiré al turno'
intent_semantics:
  objective: 'Confirmá que vas a asistir a un turno pendiente propio.'
initial: select_turno
states:
  select_turno:
    description: 'Turno a confirmar'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: confirmar
  confirmar:
    description: Confirmación
    meta:
      provides:
        - draft.token
      requires:
        - draft.id
      open_ui:
        action_id: turnos.confirmar-asistencia-como-paciente
        params:
          id: draft.id
    type: final
flow_submit:
  action_id: turnos.confirmar-asistencia-como-paciente
  params:
    id: draft.id
    token: draft.token
