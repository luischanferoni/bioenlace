# Tipo: ui-text
# Propósito: textos UX del asistente por perfil de cliente (transversal a canales).
# Consumidor: AssistantChannelCopy / ProductMetadataPaths::assistantUiTextByClientFile()
# No poner aquí: predicados de canal (ChatChannelPolicy) ni intent_id en motores.
#
# profile_id = clave de sección en client-context.yaml que matchea X-App-Client
# (mobile_paciente, whatsapp_paciente, …) o `default`.
#
# Placeholders opcionales entre llaves: {url}, {label}
version: 1

messages:
  no_intent_match:
    default: "No encontré una opción que encaje claramente con tu pedido."
    whatsapp_paciente: "No entendí del todo tu pedido. Escribí menú o probá con: mis turnos, cancelar un turno, ver laboratorio, ver recetas."

  available_options_intro:
    default: "Estas son algunas opciones disponibles para vos."
    whatsapp_paciente: "Estas son algunas opciones:"

  open_ui_button:
    default: "Abrir"
    whatsapp_paciente: "Ver en la app"
    mobile_paciente: "Abrir"

  open_ui_deep_link_suffix:
    default: ""
    whatsapp_paciente: "\n\nTambién podés verlo en la app: {url}"

  interactive_pick_one:
    default: "Elegí una opción"

  # Vacío a propósito: el texto del offer ya menciona el botón; el hint era redundante.
  interactive_buttons_hint_one:
    default: ""
    whatsapp_paciente: ""

  interactive_buttons_hint_many:
    default: ""
    whatsapp_paciente: ""

  # Match claro → botón (sin abrir el flow). No usar necesidad_usuario (etiqueta interna).
  # Placeholders: {label} {summary} {spans}
  full_match_intent:
    default: "Te ayudo con {label}."
    whatsapp_paciente: "Dale, vamos con {label}."

  full_match_intent_with_spans:
    default: "Te ayudo con {label} ({spans})."

  full_match_intent_fallback:
    default: "Te ayudo con {label}."
    whatsapp_paciente: "Dale, vamos con {label}."

  # Clara / CTA: el usuario no puede ejecutar ese trámite (sin grant ni ruta API).
  intent_not_allowed:
    default: "Entendí tu pedido, pero desde tu cuenta no podés hacer ese trámite acá. Si creés que debería estar disponible, consultá en tu centro de salud."
    whatsapp_paciente: "Entendí lo que pedís, pero con esta cuenta no puedo abrir ese trámite. Si necesitás ayuda, escribinos o consultá en tu centro."

  # Verificación de identidad del canal WhatsApp (vínculo y step-up).
  whatsapp_link_required:
    default: "Para usar Bioenlace por WhatsApp necesitás verificar tu identidad. Abrí este enlace: {url}"
    whatsapp_paciente: "Para usar Bioenlace por WhatsApp, verificá tu identidad acá: {url}"
  whatsapp_link_ready:
    default: "Listo, tu WhatsApp quedó vinculado."
  whatsapp_link_no_account:
    default: "No encontramos una cuenta con tus datos. Instalá la app Bioenlace, cargá este teléfono en tu perfil y volvé a escribirnos."
  whatsapp_link_failed:
    default: "No pudimos verificar tu identidad. Probá de nuevo o usá la app Bioenlace."
  whatsapp_link_retry:
    default: "Todavía no pudimos confirmar la verificación. Abrí el enlace de nuevo en unos segundos."
  whatsapp_link_invalid:
    default: "Este enlace ya no es válido. Escribinos de nuevo para recibir uno nuevo."
  whatsapp_link_other_number:
    default: "Este número ya está vinculado a otra cuenta. Usá tu propio número o instalá la app Bioenlace."
  whatsapp_blocked:
    default: "No podemos continuar por este número. Usá la app Bioenlace o contactá a tu centro de salud."
  whatsapp_stepup_required:
    default: "Para confirmar esta operación necesitás verificar tu identidad. Abrí este enlace: {url}"
  whatsapp_stepup_failed:
    default: "No pudimos confirmar tu identidad. La operación no se realizó. Probá de nuevo o usá la app Bioenlace."
  whatsapp_channel_redirect:
    default: "Eso no lo puedo hacer por WhatsApp. Abrí la app Bioenlace: {url}"
    whatsapp_paciente: "Eso lo tenés que hacer en la app Bioenlace. Abrila acá: {url}"
  whatsapp_write_in_app:
    default: "Para confirmar esta operación, abrí la app Bioenlace y verificá tu identidad ahí: {url}"
    whatsapp_paciente: "Para confirmar esta operación, abrí la app Bioenlace y usá tu huella o passkey: {url}"
