# Estructura planning_applied — telemetría por mensaje raíz del asistente.
# ADR: web/docs/decisions/asistente-discovery-unificado.md
version: 1

envelope_key: planning_applied

fields:
  first_ia:
    type: object
    subfields: [normalized_text, necesidad_usuario, routing_hint, tags, context_areas, extractions, intent_ids_hint]
  catalog_matches:
    type: list<object>
    item_subfields: [catalog_id, tool_id, score, routing_result]
    notes: Top N candidatos del match.
  routing_result:
    type: enum
    values: [clara, dudosa, incompletas, fuera_de_his]
  declarative_plan:
    type: object
    subfields: [tool_ids, reason]
  executed_tools:
    type: list<object>
    item_subfields: [tool_id, ms, chars, had_null_fields]
  final_path:
    type: enum
    values: [1ia_direct, 1ia_clara, 1ia_dudosa, 1ia_fuera, 2ia_guide]
  guide_prompt:
    type: string
    notes: Prompt final enviado a la 2ª IA guide (vacío si no hubo llamada).
  guide_ia_raw:
    type: string
    notes: Respuesta cruda de la 2ª IA guide (sin parse ni envelope; vacío si no hubo llamada).
