intent_id: atencion.mis-atenciones-como-paciente
version: 1
action_name: 'Ver mis atenciones'
rbac_route: /api/clinical/encounter-patient-summary/listar-atenciones-como-paciente

initial: ver_listado
states:
  ver_listado:
    label: Elegí una atención
    description: 'Atenciones finalizadas de la persona'
    explanation: 'La persona elige una atención finalizada.'
    meta:
      tags:
        - atenciones
        - encuentros
        - historial_clinico
        - resumenes
      provides:
        - draft.encounter_id
      open_ui:
        action_id: clinical.encounter.mis-atenciones-como-paciente
    always: ver_detalle
  ver_detalle:
    label: Resumen de la atención
    description: 'Resumen de esa atención'
    explanation: 'La persona elige resumen de esa atención.'
    meta:
      tags:
        - resumen
        - encuentro
        - detalle_atencion
        - epicrisis
      requires:
        - draft.encounter_id
      open_ui:
        action_id: clinical.encounter.ver-resumen-atencion-como-paciente
        params:
          encounter_id: draft.encounter_id
    outcome: 'Termina cuando la persona ve esa atención.'
    type: final

