# Política operativa pre-envío RDI (agente E03).
# Integridad hard (PES, diagnóstico codificado, código de medicamento, posología, ítems):
# ElectronicPrescription / ElectronicPrescriptionItem escenarios rdi_issue
# + PrescriptionRdiPreSubmitValidationService.
# Este YAML solo ajusta umbrales; su ausencia no desactiva los gates hard.
# {@see PrescriptionRdiPreSubmitValidationAgent}
version: 2
agent_id: prescription-rdi-pre-submit

policy:
  block_duplicate_medication_hours: 24
  min_diagnosis_display_length: 3
