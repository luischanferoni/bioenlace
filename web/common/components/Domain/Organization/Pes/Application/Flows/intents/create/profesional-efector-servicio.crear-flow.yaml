intent_id: profesional-efector-servicio.crear-flow
version: 1
action_name: 'Alta profesional en efector y agenda'
rbac_route: /api/profesional-efector-servicio/crear-flow

context:
  - servicio_acepta_turnos
  - id_persona
  - persona_requiere_cuil
  - cuil
  - agenda_ui_completed
draft_hydrator:
  handler: organization.pes_crear_alta
business_rules:
  -
    id: agenda_alta_vs_solo_horarios
    when: pre_flow
    checker: content_regex
    require_any:
      - '(cargar|configurar|editar|modificar|actualizar).*(agenda|horario|formas?\s+de\s+atencion|teleconsulta|intervalo)'
      - '(agenda|horario|formas?\s+de\s+atencion).*(profesional|m[eé]dico|doctor)'
    forbid_any:
      - 'crear|agregar|nuevo|alta|asociar|recurso humano'
      - 'formas?\s+de\s+atencion|forma\s+de\s+atencion|teleconsulta|intervalo'
    user_message: 'Parece que querés trabajar con agenda u horarios de un profesional. ¿Necesitás el flujo completo (asociar profesional y servicio) o solo cargar horarios porque ya tiene el servicio con turnos?'
    remediation:
      -
        id: flujo_completo
        label: 'Flujo completo (profesional / servicio / agenda si aplica)'
        intent_id: profesional-efector-servicio.crear-flow
        reset_flow: true
      -
        id: solo_agenda
        label: 'Solo horarios (agenda existente)'
        intent_id: profesional-agenda.configurar-staff
        reset_flow: true
      -
        id: mi_agenda
        label: 'Mis horarios (agenda o guardia/piso)'
        intent_id: profesional-horarios.gestionar-propio
        reset_flow: true
initial: select_persona
states:
  select_persona:
    label: Persona
    description: 'Persona que se asigna como profesional'
    meta:
      provides:
        - draft.id_persona
      open_ui:
        action_id: persona.buscar-para-asistente
        pass_content_as_query: q
        params:
          excluir_en_efector: '1'
    always:
      -
        guard:
          persona_requiere_cuil: SI
        target: capture_cuil
      -
        target: select_servicio
  capture_cuil:
    label: CUIL del profesional
    description: 'CUIL del profesional'
    meta:
      provides:
        - draft.cuil
      open_ui:
        action_id: profesional-efector-servicio.cargar-cuil-profesional
        params:
          id_persona: draft.id_persona
    always: select_servicio
  select_servicio:
    label: Servicio
    description: 'Servicio de la asignación'
    meta:
      provides:
        - draft.id_servicio
      open_ui:
        action_id: efectores.listar-servicios-habilitados
    always:
      -
        guard:
          servicio_acepta_turnos: SI
        target: configurar_agenda_datos
      -
        target: ''
  configurar_agenda_datos:
    label: Agenda
    description: 'Tipo de agenda de la asignación'
    meta:
      provides:
        - draft.agenda_ui_completed
      requires:
        - draft.id_profesional_efector_servicio
        - draft.id_servicio
      open_ui:
        action_id: profesional-agenda.configurar-agenda
        params:
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          id_servicio: draft.id_servicio
          ui_step: datos
    type: final
flow_submit:
  action_id: profesional-efector-servicio.crear-flow
  params:
    id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    id_servicio: draft.id_servicio
    id_persona: draft.id_persona

