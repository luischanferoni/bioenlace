# Tipo: prompt
# Propósito: corregir una palabra con error ortográfico dentro de una oración médica.
# Consumidor: IAManager::corregirPalabraConLLMReal
# Placeholders: especialidad, contexto, palabra
version: 1

template: |-
  Eres un especialista médico en {especialidad}. Analiza la siguiente oración médica y corrige SOLO la palabra indicada si tiene un error ortográfico. Si la palabra está correcta en el contexto, no la cambies.

  Oración: {contexto}
  Palabra a revisar: {palabra}
  Instrucciones:
  - Si la palabra tiene un error ortográfico, responde SOLO con la palabra corregida
  - Si la palabra está correcta (incluyendo preposiciones, artículos, etc.), responde con la misma palabra
  - Considera el contexto médico de la oración
  Corrección:
