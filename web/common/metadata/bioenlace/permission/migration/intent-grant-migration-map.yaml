# Tipo: auth
# Propósito: mapeo idempotente grants rol → intents/capabilities (migración one-shot).
# Consumidor: IntentGrantMigrationService / ProductMetadataPaths::intentGrantMigrationMapFile()
# No poner aquí: capabilities nuevas (permission/capabilities/) ni policies de recurso.
# Ejecutar: php yii catalog-permission/migrate-grants
version: 1

role_grant_sources:
  - source_permission: licencia.cargar-como-profesional-flow
    intent_targets:
      - condicion-laboral.editar-propio
  - source_permission: licencia.cargar-para-profesional-flow
    intent_targets:
      - condicion-laboral.editar-staff
  - source_permission: Licencia.create
    intent_targets:
      - condicion-laboral.editar-propio
      - condicion-laboral.editar-staff
  - source_permission: data-access.info
    intent_targets:
      - profesionales.conteo-efector
      - profesionales.distribucion-servicio-efector
  - source_permission: DataAccess.info
    intent_targets:
      - profesionales.conteo-efector
      - profesionales.distribucion-servicio-efector
  - source_permission: data-access.listar
    intent_targets:
      - profesionales.listado-efector
  - source_permission: DataAccess.list
    intent_targets:
      - profesionales.listado-efector
  - source_permission: data-access.editar
    intent_targets:
      - profesional-horarios.gestionar-propio
      - profesional-agenda.configurar-staff
      - profesional-identidad.editar-staff
  - source_permission: DataAccess.edit
    intent_targets:
      - profesional-horarios.gestionar-propio
      - profesional-agenda.configurar-staff
      - profesional-identidad.editar-staff
  - source_permission: profesional-efector-servicio.crear-flow
    intent_targets:
      - profesional-efector-servicio.baja-flow
  - source_permission: ProfesionalEfectorServicio.create
    intent_targets:
      - profesional-efector-servicio.baja-flow

# Legacy front_* / permisos operativos → capabilities UI nativa (Fase 6).
capability_grant_sources:
  - source_permission: analisis
    capability_targets:
      - encounter.capturar
  - source_permission: front_ver_historial_paciente
    capability_targets:
      - encounter.ver_como_staff

# Futuro: Entidad.atributo.read|info|edit → intents concretos (fase 6).
attribute_grant_sources: []
