intent_id: condicion-laboral.editar-propio
version: 1
operation: edit
intent_family: condicion-laboral.edit
domain_operation: ProfesionalEfectorServicio.condicion_laboral_own
action_name: 'Mi condición laboral'
rbac_route: /api/profesional-efector-servicio/editar-condicion-laboral

subject_resolution:
  handler: organization.pes_own_in_efector
field_groups:
  vigencia:
    label: Vigencia
    fields:
      - id_condicion_laboral
      - fecha_inicio
      - fecha_fin
fields:
  -
    name: id_condicion_laboral
    keywords:
      - 'tipo de licencia'
      - 'condición laboral'
      - 'motivo de ausencia'
  -
    name: fecha_inicio
    keywords:
      - desde
      - inicio
      - 'fecha de inicio'
  -
    name: fecha_fin
    keywords:
      - hasta
      - fin
      - 'fecha de fin'
field_resolution:
  reject_keywords:
    - apellido
    - nombre
    - documento
    - dni
initial: elegir_servicio
states:
  elegir_servicio:
    label: Servicio
    description: 'Asignación propia en el centro'
    meta:
      provides:
        - draft.id_profesional_efector_servicio
        - draft.id_servicio
      open_ui:
        action_id: profesional-efector-servicio.listar-mis-servicios-en-efector
        params:
          incluir_sin_agenda: '1'
    always: editar_vigencia
  editar_vigencia:
    label: Tipo y fechas de vigencia
    description: 'Tipo de condición laboral y fechas de vigencia'
    meta:
      open_ui:
        action_id: profesional-efector-servicio.editar-condicion-laboral
    type: final

