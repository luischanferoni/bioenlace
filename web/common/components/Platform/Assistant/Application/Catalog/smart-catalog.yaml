# Catálogo inteligente del asistente — triggers → tools ejecutables.
# Schema: assistant/schemas/smart-catalog-entry-v1.yaml
# Frontera A/B/C: .cursor/rules/asistente-intents-frontera-sin-solape.mdc
# Phrases/keywords: español con acentos; el match hace fold (no duplicar sin acento).
version: 1

entries:
  - id: atencion-sintoma
    # Charla + CTA (no abrir triage solo por “me duele”).
    match_only: true
    routing_result: incompletas
    priority: 90
    triggers:
      tags: [sintoma, dolor, malestar, necesito_atencion, medicamento]
      phrases:
        - me duele
        - me molesta
        - me siento mal
        - necesito atención
        - efecto adverso
        - efectos adversos
        - me cayó mal
        - reacción al medicamento
        - pinchazo en el pecho
        - pinchazo en pecho
        - dolor en el pecho
        - me duele el pecho
        - falta de aire
      keywords: [panza, cabeza, fiebre, vómito, pecho, pinchazo, tórax]
    cta_intent_ids:
      - atencion.necesito-atencion

  - id: atencion-estudio
    tool_type: intent
    tool_ref: atencion.necesito-atencion
    routing_result: clara
    priority: 92
    triggers:
      tags: [estudio, pedido_estudio, acto_clinico]
      phrases:
        - necesito una ecografía
        - necesito una mamografía
        - necesito un estudio
        - sacar turno para estudio
        - turno para ecografía
        - turno para mamografía
        - turno para laboratorio
        - turno para análisis
        - análisis de sangre

  - id: atencion-control
    tool_type: intent
    tool_ref: atencion.necesito-atencion
    routing_result: clara
    priority: 91
    triggers:
      tags: [control, seguimiento]
      phrases:
        - controlar la diabetes
        - control de seguimiento
        - renovar medicación
        - consulta por mensaje
        - consulta clínica por mensaje
        - pedir un control

  # Zona C: pedido de agenda sin destino → incompletas + CTAs (no lanzar flow).
  - id: agenda-pedido-sin-destino
    match_only: true
    routing_result: incompletas
    priority: 88
    triggers:
      tags: [pedido_turno_sin_destino]
      phrases:
        - quiero un turno
        - necesito un turno
        - sacar un turno
        - agendar un turno
      context_areas: [scheduling]
    cta_intent_ids:
      - turnos.crear-como-paciente
      - atencion.necesito-atencion

  # Zona A: ya hay oferta/profesional → agenda pura.
  - id: turnos-crear
    tool_type: intent
    tool_ref: turnos.crear-como-paciente
    routing_result: clara
    priority: 85
    triggers:
      tags: [sacar_turno]
      phrases:
        - turno con
        - turno en
        - cita con
        - cita en
        - turno para mí
        - solicita un turno para mí
      context_areas: [scheduling]

  # Pregunta de plazos/reglas ≠ ejecutar cancelación.
  - id: turnos-politica-autogestion
    tool_type: intent
    tool_ref: turnos.consultar-politica-autogestion-flow
    routing_result: clara
    priority: 89
    triggers:
      tags: [politica_turnos]
      phrases:
        - hasta cuándo puedo cancelar
        - me multan
        - multa si no voy
        - política de cancelación
        - puedo cancelar por app
        - reglas de cancelación
      context_areas: [scheduling]

  - id: turnos-cancelar-paciente
    tool_type: intent
    tool_ref: turnos.cancelar-como-paciente-flow
    routing_result: clara
    priority: 87
    triggers:
      tags: [cancelar_turno]
      phrases:
        - cancelar turno
        - cancela el turno
        - anular turno
        - dar de baja turno
        - no puedo ir al turno
      context_areas: [scheduling]

  - id: laboratorio-mis-resultados
    tool_type: intent
    tool_ref: laboratorio.ver-resultados-como-paciente
    routing_result: clara
    priority: 86
    triggers:
      tags: [mis_analisis]
      phrases:
        - mis análisis
        - mis resultados
        - resultados de laboratorio
        - informes de laboratorio
        - ver mis estudios
      context_areas: [clinical]

  # Pasados ≠ próximos pendientes.
  - id: turnos-historial-paciente
    tool_type: intent
    tool_ref: turnos.ver-turnos-anteriores-como-paciente
    routing_result: clara
    priority: 88
    triggers:
      tags: [historial_turnos]
      phrases:
        - turnos que ya tuve
        - turnos que tuve
        - turnos anteriores
        - historial de turnos
        - turnos pasados
        - citas anteriores
        - citas pasadas
        - mis turnos pasados
      context_areas: [scheduling]

  - id: turnos-ver-paciente
    tool_type: intent
    tool_ref: turnos.ver-mis-turnos-como-paciente
    routing_result: clara
    priority: 80
    triggers:
      tags: [mis_turnos, ver_turnos]
      phrases:
        - mis turnos
        - cuáles son mis turnos
        - qué turnos tengo
        - próximo turno
        - mis citas
        - turnos pendientes
      context_areas: [scheduling]

  - id: turnos-ultimo-en-oferta
    tool_type: intent
    tool_ref: turnos.ver-ultimo-en-oferta-como-paciente
    routing_result: clara
    priority: 78
    triggers:
      tags: [ultima_vez_oferta]
      phrases:
        - última vez que fui
        - cuándo fui al
        - última vez al dentista
        - cuándo fue la última vez
      context_areas: [scheduling]

  # Resumen clínico de la última consulta (≠ última vez en oferta / ≠ turnos pasados).
  - id: atencion-ultima-resumen
    tool_type: intent
    tool_ref: atencion.ver-ultima-como-paciente
    routing_result: clara
    priority: 90
    triggers:
      tags: [ultima_atencion]
      phrases:
        - qué me dijo
        - me dijo el médico
        - última atención
        - última consulta
        - resumen de la consulta
        - mi última consulta
      context_areas: [clinical]

  - id: atencion-mis-consultas
    tool_type: intent
    tool_ref: atencion.mis-atenciones-como-paciente
    routing_result: clara
    priority: 84
    triggers:
      tags: [mis_atenciones]
      phrases:
        - mis atenciones
        - mis consultas
        - historial de consultas
        - atenciones anteriores
        - consultas anteriores
        - resumen de atención
      context_areas: [clinical]

  - id: llegar-tarde-politicas
    tool_type: aspect
    tool_ref: site.appointment.policies
    routing_result: incompletas
    priority: 75
    triggers:
      tags: [llegar_tarde, tolerancia]
      phrases: [llego tarde, llegar tarde, me esperan, voy tarde, minutos tarde]
      context_areas: [scheduling]

  - id: llegar-tarde-cita-actual
    tool_type: aspect
    tool_ref: appointment.current
    routing_result: incompletas
    priority: 70
    triggers:
      tags: [llegar_tarde]
      phrases: [llego tarde, llegar tarde, voy tarde, mi turno, mi cita]
      context_areas: [scheduling]
    required_anchors: [subject_persona]

  - id: articulo-representacion
    tool_type: article
    tool_ref: representacion
    routing_result: clara
    priority: 85
    triggers:
      tags: [representacion, tutela, representante]
      phrases: [representación, operar por mi hijo, vincular menor, designar representante, tutor]
      context_areas: [person]
      keywords: [sobrino, sobrina, hijo, hija, menor, tutela]

  - id: fuera-his-servicios-inexistentes
    match_only: true
    routing_result: fuera_de_his
    priority: 10
    triggers:
      tags: [fuera_his]
      phrases: [medium, sesión con una medium, clima, chiste, horóscopo]

  - id: profesionales-listado-staff
    tool_type: intent
    tool_ref: profesionales.listado-efector
    routing_result: clara
    priority: 70
    triggers:
      tags: [listar_profesionales, staff]
      phrases: [listar profesionales, profesionales del centro, médicos del centro]
      context_areas: [geo_resources]
