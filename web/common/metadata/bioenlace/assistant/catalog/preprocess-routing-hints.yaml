# routing_hint del preprocess (1ª IA). Claves = {@see PreprocessRoutingHintCatalog}.
# Consumidor: ChatPreprocessService, SmartCatalogRoutingService, smart-catalog routing_result.
version: 1

hints:
  clara: Hay un trámite o consulta operativa concreta a ejecutar o abrir
  incompletas: Pregunta de reglas, políticas, cómo funciona, o hace falta dato HIS para responder
  directo: Alcanza un artículo o respuesta fija sin más datos (poco frecuente)
  dudosa: Saludo solo, sin sentido útil, o falta un dato clave para actuar
  fuera_de_his: Tema ajeno al HIS

# Alias legacy user_goal → routing_hint (transición preprocess v1).
legacy_user_goal:
  guide: incompletas
  operational: clara
  in_flow_question: clara
  ambiguous: dudosa

# Tags que la 1ª IA puede emitir aunque no estén en smart-catalog triggers.
extra_preprocess_tags:
  - in_flow_question
