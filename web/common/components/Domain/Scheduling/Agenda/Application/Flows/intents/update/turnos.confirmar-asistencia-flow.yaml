intent_id: turnos.confirmar-asistencia-flow
version: 1
action_name: 'Confirmar asistencia al turno'
rbac_route: /api/turnos/confirmar-asistencia-como-paciente

initial: select_turno
states:
  select_turno:
    label: Turno a confirmar
    description: 'Turno pendiente por confirmar'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: confirmar
  confirmar:
    label: Confirmación
    description: 'Confirmación de asistencia al turno'
    meta:
      provides:
        - draft.token
      requires:
        - draft.id
      open_ui:
        action_id: turnos.confirmar-asistencia-como-paciente
        params:
          id: draft.id
    type: final
flow_submit:
  action_id: turnos.confirmar-asistencia-como-paciente
  params:
    id: draft.id
    token: draft.token

