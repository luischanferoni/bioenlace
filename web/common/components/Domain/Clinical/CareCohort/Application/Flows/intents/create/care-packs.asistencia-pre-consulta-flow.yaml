intent_id: care-packs.asistencia-pre-consulta-flow
version: 1
shortcut:
  hidden: true
action_name: 'Cuestionario pre-consulta'
rbac_route: /api/care-packs/assistance

guide:
  funcionalidad: 'Permite al paciente completar un cuestionario de asistencia pre-consulta. El flujo primero presenta una lista de turnos pendientes de cuestionario, luego abre el formulario de asistencia para el turno seleccionado. El resultado final es el cuestionario completado y guardado.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Cuestionario de asistencia completado exitosamente.
    - Turno seleccionado para completar el cuestionario.

initial: select_turno
states:
  select_turno:
    label: Turno
    description: 'Turno con cuestionario de asistencia'
    explanation: 'La persona elige turno con cuestionario de asistencia.'
    meta:
      tags:
        - preconsulta
        - cuestionario
        - formulario
        - pack
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: completar
  completar:
    label: Cuestionario
    description: 'Respuestas del cuestionario de asistencia'
    explanation: 'La persona elige respuestas del cuestionario de asistencia.'
    meta:
      tags:
        - preconsulta
        - respuestas
        - cuestionario
        - pendiente
      requires:
        - draft.id
      open_ui:
        action_id: care-packs.assistance
        params:
          turno_id: draft.id
    outcome: 'Termina cuando la persona completa el cuestionario.'
    type: final
flow_submit:
  action_id: care-packs.assistance
  params:
    turno_id: draft.id

