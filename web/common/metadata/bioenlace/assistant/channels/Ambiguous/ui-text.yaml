# Tipo: ui-text
# Propósito: mensaje + opciones de encauzamiento del canal ambiguous (sin 2.ª IA).
# Consumidor: AmbiguousChannelConfig / ProductMetadataPaths::ambiguousChannelFile()
# Espejo PHP: Platform/Assistant/Chat/Channels/Ambiguous/
# No poner aquí: prompts de IA ni predicados de canal (ChatChannelPolicy).
#
# Botones → intent_id `assistant.channel.<next_channel>` (ChatRouter).
version: 1

message: >
  No estoy seguro de qué necesitás. Elegí la opción que mejor describa tu pedido
  (o reformulá en un mensaje).

options:
  - id: guide
    label: Charla, salud o cómo funciona la app
    next_channel: guide
    content: Necesito orientación o ayuda en Bioenlace

  - id: do_now
    label: Quiero hacer un trámite ahora
    next_channel: operational
    content: Quiero hacer un trámite en el sistema
