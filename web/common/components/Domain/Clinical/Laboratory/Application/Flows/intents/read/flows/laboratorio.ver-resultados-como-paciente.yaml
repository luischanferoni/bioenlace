intent_id: laboratorio.ver-resultados-como-paciente
version: 1
action_name: 'Ver resultados de laboratorio'
rbac_route: /api/clinical/laboratory-result/mis-resultados-como-paciente

guide:
  funcionalidad: 'Permite al paciente ver sus informes de laboratorio y acceder al detalle de cada uno. El flujo presenta el listado de análisis realizados y permite navegar al detalle con valores y referencias. El resultado final es la visualización del informe seleccionado.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Visualización del listado de informes de laboratorio.
    - Visualización del detalle de un informe con valores y referencias.

initial: ver_listado
states:
  ver_listado:
    label: Elegí un informe de laboratorio
    description: 'Informes de laboratorio de la persona'
    explanation: 'La persona elige un informe de laboratorio.'
    meta:
      tags:
        - laboratorio
        - analisis
        - resultados
        - mis_analisis
        - informe
        - valores
      provides:
        - draft.report_id
      open_ui:
        action_id: clinical.laboratory-result.mis-resultados-como-paciente
    always: ver_detalle
  ver_detalle:
    label: Detalle del informe
    description: 'Detalle del informe de laboratorio'
    explanation: 'La persona elige detalle del informe de laboratorio.'
    meta:
      tags:
        - informe
        - valores
        - referencia
        - resultado
      requires:
        - draft.report_id
      open_ui:
        action_id: clinical.laboratory-result.ver-informe-como-paciente
        params:
          report_id: draft.report_id
    outcome: 'Termina cuando la persona ve el informe de laboratorio.'
    type: final

