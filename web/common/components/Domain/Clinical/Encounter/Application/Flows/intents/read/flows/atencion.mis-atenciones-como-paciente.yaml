intent_id: atencion.mis-atenciones-como-paciente
version: 1
action_name: 'Ver mis atenciones'
rbac_route: /api/clinical/encounter-patient-summary/listar-atenciones-como-paciente

guide:
  funcionalidad: 'Permite al paciente ver el listado de sus atenciones finalizadas y seleccionar una para ver su resumen. El flujo presenta las atenciones del historial clínico y permite navegar al detalle de cada una. El resultado final es la visualización del resumen de la atención seleccionada.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Visualización del listado de atenciones finalizadas.
    - Visualización del resumen de una atención específica.

initial: ver_listado
states:
  ver_listado:
    label: Elegí una atención
    description: 'Atenciones finalizadas de la persona'
    explanation: 'La persona elige una atención finalizada.'
    meta:
      tags:
        - atenciones
        - encuentros
        - historial_clinico
        - resumenes
      provides:
        - draft.encounter_id
      open_ui:
        action_id: clinical.encounter.mis-atenciones-como-paciente
    always: ver_detalle
  ver_detalle:
    label: Resumen de la atención
    description: 'Resumen de esa atención'
    explanation: 'La persona elige resumen de esa atención.'
    meta:
      tags:
        - resumen
        - encuentro
        - detalle_atencion
        - epicrisis
      requires:
        - draft.encounter_id
      open_ui:
        action_id: clinical.encounter.ver-resumen-atencion-como-paciente
        params:
          encounter_id: draft.encounter_id
    outcome: 'Termina cuando la persona ve esa atención.'
    type: final

