intent_id: tratamiento.adherencia-resumen-staff
version: 1
action_name: 'Adherencia a tratamientos'
rbac_route: /api/clinical/care-plan/active

guide:
  funcionalidad: 'Permite al staff visualizar el resumen de adherencia a los tratamientos en el efector. El flujo abre un dashboard que muestra métricas de cumplimiento y toma de medicamentos de los pacientes del centro. El resultado final es la visualización de los indicadores de adherencia.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Visualización del dashboard de adherencia del efector.
    - Selección de un plan de cuidado específico para ver detalles.

initial: ver_dashboard
states:
  ver_dashboard:
    label: Resumen de adherencia en el efector
    description: 'Adherencia al tratamiento en el centro'
    explanation: 'La persona elige adherencia al tratamiento en el centro.'
    meta:
      tags:
        - adherencia
        - cumplimiento
        - toma
        - dashboard
      provides:
        - draft.care_plan_id
      open_ui:
        action_id: clinical.care-plan.adherencia-resumen-staff
    outcome: 'Termina cuando la persona ve la adherencia a los tratamientos del centro.'
    type: final

