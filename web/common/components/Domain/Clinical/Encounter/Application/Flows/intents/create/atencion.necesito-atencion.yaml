intent_id: atencion.necesito-atencion
version: 1
action_name: 'Solicitar Atención'
rbac_route: /api/turnos/crear-como-paciente

draft_hydrator:
  handler: scheduling.solicitar_atencion
initial: triage_raiz
context:
  - tipo_atencion
  - teleconsulta_ofercible
  - async_ofrecible
  - modalidad_paso_requerido
  - servicio_reserva_rol
  - triage_servicio_rol_ideal
  - triage_codigo_servicio_resolutor
  - reserva_servicio_autogestion
  - reserva_servicio_mensaje
  - reserva_modo_hub_paciente
  - fecha_turno
  - care_plan_id
  - triage_raiz
  - triage_alarmas
  - triage_zona
  - triage_nota
  - reserva_triage_halt
  - urgency_band
  - intake_tipo
  - seguimiento_necesidad
  - preferencia_profesional_turno
  - encounter_id
  - mensaje
  - medication_request_ids
  - medicacion_operacion
  - ajuste_motivo
  - id_servicio_asignado
  - id_efector
  - id_profesional_efector_servicio
  - slot_id
  - control_hub_anchor
  - control_hub_kind
  - condition_ref
  - condition_accion
  - condition_codigo
  - protocol_id
  - protocol_action_outcome
  - pedido_acto
  - pedido_modo
  - pedido_linea_ids
  - pedido_servicio_resuelto
  - pedido_mensaje
states:
  triage_raiz:
    label: Motivo
    description: 'Posibles motivos de consulta de la persona'
    meta:
      tags:
        - sintomas
        - sintoma
        - dolor
        - malestar
        - condiciones
        - atencion
        - turno
        - solicitud
      review_prefilled: true
      provides:
        - draft.triage_raiz
      open_ui:
        action_id: turnos.reserva-triage-paso
        params:
          step: raiz
    always:
      -
        guard:
          triage_raiz: urgencia
        target: triage_urgencia
      -
        guard:
          triage_raiz: malestar_nuevo
        target: triage_zona
      -
        guard:
          triage_raiz: estudio_pedido
        target: select_pedido_acto
      -
        guard:
          triage_raiz: seguimiento_cronico
        target: cs_hub
      -
        guard:
          modalidad_paso_requerido: '0'
        target: select_servicio
      -
        target: select_tipo_atencion
  select_pedido_acto:
    label: 'Estudio o práctica'
    description: 'Estudio o práctica que la persona necesita'
    meta:
      tags:
        - estudio
        - practica
      review_prefilled: true
      provides:
        - draft.pedido_acto
      requires:
        - draft.triage_raiz
      open_ui:
        action_id: turnos.reserva-triage-paso
        params:
          step: pedido_acto
          step_title: '¿Qué estudio o práctica necesitás?'
          triage_raiz: draft.triage_raiz
    always:
      -
        guard:
          modalidad_paso_requerido: '0'
          pedido_servicio_resuelto: '1'
        target: select_efector
      -
        guard:
          pedido_servicio_resuelto: '1'
        target: select_tipo_atencion
      -
        guard:
          modalidad_paso_requerido: '0'
        target: select_servicio
      -
        target: select_tipo_atencion
  cs_hub:
    label: '¿Sobre qué es el control o seguimiento?'
    description: 'Tema del control o seguimiento'
    meta:
      tags:
        - control
        - seguimiento
      provides:
        - draft.control_hub_anchor
        - draft.control_hub_kind
      open_ui:
        action_id: consultas-seguimiento.hub
    always:
      -
        guard:
          control_hub_kind: care_plan
        target: cs_select_necesidad
      -
        guard:
          control_hub_kind: condition
        target: cs_condition_acciones
      -
        guard:
          control_hub_kind: protocol
        target: cs_condition_acciones
  cs_condition_acciones:
    label: '¿Qué necesitás?'
    description: 'Qué necesita sobre ese control'
    meta:
      provides:
        - draft.condition_accion
      requires:
        - draft.control_hub_kind
      open_ui:
        action_id: consultas-seguimiento.condicion-acciones
        params:
          condition_codigo: draft.condition_codigo
          condition_ref: draft.condition_ref
          protocol_id: draft.protocol_id
    always:
      -
        guard:
          protocol_action_outcome: modalidad
        target: select_tipo_atencion
      -
        guard:
          condition_accion: solicitar_turno
        target: select_tipo_atencion
      -
        guard:
          protocol_action_outcome: captura_mensaje
        target: cs_captura_consulta_general
      -
        guard:
          condition_accion: consulta_mensaje
        target: cs_captura_consulta_general
      -
        target: cs_captura_consulta_general
  triage_zona:
    label: Zona
    description: 'Zona del cuerpo del malestar'
    meta:
      tags:
        - sintomas
        - sintoma
        - dolor
        - malestar
      review_prefilled: true
      provides:
        - draft.triage_zona
      requires:
        - draft.triage_raiz
      open_ui:
        action_id: turnos.reserva-triage-paso
        params:
          step: zona
          triage_raiz: draft.triage_raiz
    always:
      -
        guard:
          modalidad_paso_requerido: '0'
        target: select_servicio
      -
        target: select_tipo_atencion
  triage_urgencia:
    label: Urgencia
    description: 'Orientación por urgencia'
    meta:
      tags:
        - urgencia
        - emergencia
        - alarma
      requires:
        - draft.reserva_triage_halt
      open_ui:
        action_id: turnos.reserva-triage-urgencia
      terminal_without_submit: true
      flow_dismiss:
        label: Entendido
      flow_actions:
        -
          label: 'Llamar al 107'
          href: 'tel:107'
          variant: danger
    type: final
  select_tipo_atencion:
    label: Modalidad
    description: 'Formas de atenderse'
    meta:
      provides:
        - draft.tipo_atencion
      requires:
        - draft.triage_raiz
      open_ui:
        action_id: turnos.reserva-triage-paso
        params:
          step: modalidad
          step_title: '¿Cómo preferís la atención?'
          triage_raiz: draft.triage_raiz
          triage_alarmas: draft.triage_alarmas
          triage_zona: draft.triage_zona
          care_plan_id: draft.care_plan_id
          pedido_acto: draft.pedido_acto
          pedido_modo: draft.pedido_modo
    always:
      -
        guard:
          tipo_atencion: async
        target: solicitud_async
      -
        guard:
          tipo_atencion: teleconsulta
          seguimiento_necesidad: solicitar_turno
        target: cs_select_dia_teleconsulta
      -
        guard:
          tipo_atencion: teleconsulta
        target: select_dia_teleconsulta
      -
        guard:
          seguimiento_necesidad: solicitar_turno
        target: cs_select_preferencia_turno
      -
        guard:
          pedido_servicio_resuelto: '1'
        target: select_efector
      -
        target: select_servicio
  solicitud_async:
    label: Describí tu consulta en el campo de texto de abajo
    description: 'Consulta que la persona escribe para un profesional'
    meta:
      provides:
        - draft.mensaje
      requires:
        - draft.triage_raiz
        - draft.tipo_atencion
      composer_capture:
        draft_field: mensaje
        placeholder: 'Contanos tu consulta con el mayor detalle posible. Un profesional te responderá por mensaje.'
        min_length: 10
        submit_action_id: consulta-async.solicitar-como-paciente
        params:
          triage_raiz: draft.triage_raiz
          triage_alarmas: 'draft.triage_alarmas?'
          triage_zona: 'draft.triage_zona?'
          triage_evolucion: 'draft.triage_evolucion?'
          care_plan_id: 'draft.care_plan_id?'
          triage_nota: 'draft.triage_nota?'
          mensaje: draft.mensaje
      terminal_without_submit: true
    type: final
  select_servicio:
    label: Servicio
    description: 'Servicio del centro para la atención'
    meta:
      provides:
        - draft.id_servicio_asignado
      requires:
        - draft.tipo_atencion
      open_ui:
        action_id: servicios.elegir-acepta-turnos
        params:
          tipo_atencion: draft.tipo_atencion
          triage_raiz: draft.triage_raiz
          triage_alarmas: draft.triage_alarmas
          triage_zona: draft.triage_zona
          care_plan_id: draft.care_plan_id
          pedido_acto: draft.pedido_acto
          pedido_modo: draft.pedido_modo
          pedido_linea_ids: draft.pedido_linea_ids
          pedido_servicio_resuelto: draft.pedido_servicio_resuelto
      hint:
        entity: servicio
        match_property: nombre
    always: select_efector
  select_efector:
    label: Centro de salud
    description: 'Centro donde atenderse'
    meta:
      provides:
        - draft.id_efector
      requires:
        - draft.id_servicio_asignado
        - draft.tipo_atencion
      chooser:
        when_user_says_nearby:
          open_ui:
            action_id: efectores.listar-por-servicio-cercano
            params:
              id_servicio: draft.id_servicio_asignado
        otherwise:
          open_ui:
            action_id: efectores.listar-por-servicio
            params:
              id_servicio: draft.id_servicio_asignado
      hint:
        entity: efector
        match_property: nombre
    always: select_profesional
  select_profesional:
    label: Profesional
    description: 'Profesional de ese servicio en ese centro'
    meta:
      provides:
        - draft.id_profesional_efector_servicio
      requires:
        - draft.id_efector
        - draft.id_servicio_asignado
      open_ui:
        action_id: profesional-efector-servicio.listar-por-efector-servicio-acepta-turnos
        params:
          id_efector: draft.id_efector
          id_servicio: draft.id_servicio_asignado
          tipo_atencion: draft.tipo_atencion
      hint:
        entity: profesional
        match_property: nombre
    always: select_dia
  select_dia:
    label: Día
    description: 'Día con lugar'
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: turnos.slots-dias-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    always: select_slot
  select_slot:
    label: Horario
    description: 'Horario disponible para el turno'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id_profesional_efector_servicio
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          fecha: draft.fecha_turno
    type: final
  select_dia_teleconsulta:
    label: Día (teleconsulta con Medicina General)
    description: 'Día de teleconsulta con Medicina General'
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.tipo_atencion
      open_ui:
        action_id: turnos.slots-dias-disponibles-como-paciente
        params:
          reserva_modo: teleconsulta_hub
          triage_raiz: draft.triage_raiz
          triage_zona: draft.triage_zona
          care_plan_id: draft.care_plan_id
    always: select_slot_teleconsulta
  select_slot_teleconsulta:
    label: Horario (teleconsulta con Medicina General)
    description: 'Horario de teleconsulta con Medicina General'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.tipo_atencion
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-disponibles-como-paciente
        params:
          reserva_modo: teleconsulta_hub
          triage_raiz: draft.triage_raiz
          triage_zona: draft.triage_zona
          care_plan_id: draft.care_plan_id
          fecha: draft.fecha_turno
    type: final
  cs_select_tipo:
    label: '¿Sobre qué es el control o seguimiento?'
    description: 'Tema del control o seguimiento'
    meta:
      provides:
        - draft.intake_tipo
      open_ui:
        action_id: consultas-seguimiento.paso
        params:
          step: tipo
    always:
      -
        guard:
          intake_tipo: consulta_general
        target: cs_captura_consulta_general
      -
        guard:
          intake_tipo: seguimiento_consulta_previa
        target: cs_select_encounter_previa
      -
        guard:
          intake_tipo: seguimiento
        target: cs_select_care_plan
      -
        target: cs_select_care_plan
  cs_select_encounter_previa:
    label: '¿Sobre qué atención?'
    description: 'Atención anterior del control'
    meta:
      provides:
        - draft.encounter_id
      requires:
        - draft.intake_tipo
      open_ui:
        action_id: clinical.encounter.mis-atenciones-como-paciente
    always: cs_captura_consulta_previa
  cs_captura_consulta_previa:
    label: Contanos en el campo de abajo
    description: 'Consulta sobre una atención anterior'
    meta:
      provides:
        - draft.mensaje
      requires:
        - draft.intake_tipo
        - draft.encounter_id
      composer_capture:
        draft_field: mensaje
        placeholder: 'Contanos tu consulta o evolución respecto de esa atención.'
        min_length: 10
        submit_action_id: consulta-async.solicitar-como-paciente
        params:
          intake_tipo: seguimiento_consulta_previa
          encounter_id: draft.encounter_id
          triage_raiz: seguimiento_cronico
          mensaje: draft.mensaje
      terminal_without_submit: true
    type: final
  cs_select_care_plan:
    label: Tu tratamiento
    description: 'Tratamiento del control'
    meta:
      review_prefilled: true
      provides:
        - draft.care_plan_id
      requires:
        - draft.intake_tipo
      open_ui:
        action_id: clinical.care-plan.ver-tratamiento-paciente
    always: cs_select_necesidad
  cs_select_necesidad:
    label: '¿Qué necesitás?'
    description: 'Qué necesita sobre el tratamiento'
    meta:
      provides:
        - draft.seguimiento_necesidad
      requires:
        - draft.care_plan_id
      open_ui:
        action_id: consultas-seguimiento.paso
        params:
          step: necesidad
    always:
      -
        guard:
          seguimiento_necesidad: renovar_medicacion
        target: cs_select_medicamentos
      -
        guard:
          seguimiento_necesidad: solicitar_ajuste
        target: cs_select_medicamentos
      -
        guard:
          seguimiento_necesidad: solicitar_turno
          modalidad_paso_requerido: '0'
        target: cs_select_preferencia_turno
      -
        guard:
          seguimiento_necesidad: solicitar_turno
        target: select_tipo_atencion
      -
        target: cs_captura_seguimiento_mensaje
  cs_select_medicamentos:
    label: Medicación
    description: 'Medicación del tratamiento'
    meta:
      tags:
        - medicacion
        - medicamento
      provides:
        - draft.medication_request_ids
      requires:
        - draft.care_plan_id
        - draft.seguimiento_necesidad
      open_ui:
        action_id: clinical.care-plan.medicamentos-como-paciente
        params:
          care_plan_id: draft.care_plan_id
      flow_submit:
        action_id: clinical.care-plan.confirmar-renovacion-como-paciente
        label: 'Solicitar renovación'
        params:
          care_plan_id: draft.care_plan_id
          medication_request_ids: draft.medication_request_ids
          intake_tipo: seguimiento
          seguimiento_necesidad: draft.seguimiento_necesidad
          medicacion_operacion: renovacion
          triage_raiz: seguimiento_cronico
    always:
      -
        guard:
          seguimiento_necesidad: solicitar_ajuste
        target: cs_captura_ajuste_motivo
      -
        guard:
          seguimiento_necesidad: renovar_medicacion
        target: ''
  cs_captura_ajuste_motivo:
    label: '¿Qué cambio necesitás?'
    description: 'Cambio que pide en la medicación'
    meta:
      provides:
        - draft.ajuste_motivo
      requires:
        - draft.care_plan_id
        - draft.medication_request_ids
        - draft.seguimiento_necesidad
      composer_capture:
        draft_field: ajuste_motivo
        placeholder: 'Indicá qué cambio necesitás y por qué (síntomas, horarios, etc.).'
        min_length: 10
        submit_action_id: consulta-async.solicitar-como-paciente
        params:
          intake_tipo: seguimiento
          seguimiento_necesidad: draft.seguimiento_necesidad
          care_plan_id: draft.care_plan_id
          medication_request_ids: draft.medication_request_ids
          medicacion_operacion: ajuste
          triage_raiz: seguimiento_cronico
          ajuste_motivo: draft.ajuste_motivo
      terminal_without_submit: true
    type: final
  cs_captura_consulta_general:
    label: Escribí tu consulta en el campo de abajo
    description: 'Consulta del control'
    meta:
      provides:
        - draft.mensaje
      requires:
        - draft.intake_tipo
      composer_capture:
        draft_field: mensaje
        placeholder: 'Contanos tu consulta con el mayor detalle posible. Un profesional te responderá por mensaje.'
        min_length: 10
        submit_action_id: consulta-async.solicitar-como-paciente
        params:
          intake_tipo: consulta_general
          mensaje: draft.mensaje
          triage_raiz: seguimiento_cronico
      terminal_without_submit: true
    type: final
  cs_captura_seguimiento_mensaje:
    label: Contanos en el campo de abajo
    description: 'Mensaje de seguimiento'
    meta:
      provides:
        - draft.mensaje
      requires:
        - draft.seguimiento_necesidad
        - draft.care_plan_id
      composer_capture:
        draft_field: mensaje
        placeholder: 'Contanos tu duda o cómo te sentís, con el mayor detalle posible.'
        min_length: 10
        submit_action_id: consulta-async.solicitar-como-paciente
        params:
          intake_tipo: seguimiento
          seguimiento_necesidad: draft.seguimiento_necesidad
          care_plan_id: draft.care_plan_id
          triage_raiz: seguimiento_cronico
          mensaje: draft.mensaje
      terminal_without_submit: true
    type: final
  cs_select_preferencia_turno:
    label: '¿Con quién querés el control?'
    description: 'Con quién quiere el control'
    meta:
      provides:
        - draft.preferencia_profesional_turno
      requires:
        - draft.seguimiento_necesidad
        - draft.care_plan_id
        - draft.tipo_atencion
      open_ui:
        action_id: consultas-seguimiento.paso
        params:
          step: preferencia_turno
          step_title: '¿Con quién querés el control?'
    always:
      -
        guard:
          preferencia_profesional_turno: mismo_medico
        target: cs_select_dia
      -
        target: cs_select_efector
  cs_select_efector:
    label: Centro de salud
    description: 'Centro para el control'
    meta:
      provides:
        - draft.id_efector
      requires:
        - draft.id_servicio_asignado
        - draft.tipo_atencion
      open_ui:
        action_id: efectores.listar-por-servicio
        params:
          id_servicio: draft.id_servicio_asignado
    always: cs_select_profesional
  cs_select_profesional:
    label: Profesional
    description: 'Profesional para el control'
    meta:
      provides:
        - draft.id_profesional_efector_servicio
      requires:
        - draft.id_efector
        - draft.id_servicio_asignado
      open_ui:
        action_id: profesional-efector-servicio.listar-por-efector-servicio-acepta-turnos
        params:
          id_efector: draft.id_efector
          id_servicio: draft.id_servicio_asignado
          tipo_atencion: draft.tipo_atencion
    always: cs_select_dia
  cs_select_dia:
    label: Día
    description: 'Día del control'
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: turnos.slots-dias-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    always: cs_select_slot
  cs_select_slot:
    label: Horario
    description: 'Horario del control'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id_profesional_efector_servicio
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          fecha: draft.fecha_turno
    type: final
  cs_select_dia_teleconsulta:
    label: Día (teleconsulta con Medicina General)
    description: 'Día de teleconsulta del control'
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.tipo_atencion
        - draft.care_plan_id
      open_ui:
        action_id: turnos.slots-dias-disponibles-como-paciente
        params:
          reserva_modo: teleconsulta_hub
          care_plan_id: draft.care_plan_id
    always: cs_select_slot_teleconsulta
  cs_select_slot_teleconsulta:
    label: Horario (teleconsulta con Medicina General)
    description: 'Horario de teleconsulta del control'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.tipo_atencion
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-disponibles-como-paciente
        params:
          reserva_modo: teleconsulta_hub
          care_plan_id: draft.care_plan_id
          fecha: draft.fecha_turno
    type: final
flow_submit:
  action_id: turnos.crear-como-paciente
  params:
    slot_id: draft.slot_id
    triage_raiz: draft.triage_raiz
    tipo_atencion: draft.tipo_atencion
    id_servicio_asignado: 'draft.id_servicio_asignado?'
    id_efector: 'draft.id_efector?'
    triage_alarmas: 'draft.triage_alarmas?'
    triage_zona: 'draft.triage_zona?'
    care_plan_id: 'draft.care_plan_id?'
    triage_nota: 'draft.triage_nota?'
    intake_tipo: 'draft.intake_tipo?'
    seguimiento_necesidad: 'draft.seguimiento_necesidad?'

