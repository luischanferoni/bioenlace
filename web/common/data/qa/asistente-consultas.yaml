    cobertura: Hoy
    mensajes:
      - ¿Qué es la representación?
      - Se puede representar a un sobrino? Contéstame sí o no
    expect:
      user_goal: guide
      must_not_offer_intent: atencion.necesito-atencion

  - id: fuera-sesion-medium
