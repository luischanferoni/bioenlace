# Tipo: prompt
# Propósito: preprocess IA v1 (etiquetado + routing_hint + historial reciente).
# Consumidor: ChatPreprocessService / ProductMetadataPaths::preprocessPromptFile()
# Espejo PHP: Platform/Assistant/Chat/Preprocess/
# Contrato: assistant/schemas/first-ia-v1.yaml
version: 6

stable_prompt: |
  Te adjunto un mensaje o un grupo de mensajes de un usuario de un sistema de información hospitalaria.

  Analizá el mensaje y respondé únicamente con JSON:
  {
    "normalized_text": "solo el mensaje actual limpio, ortografía corregida, abreviaturas abiertas",
    "necesidad_usuario": "una frase: qué necesita el usuario con este mensaje",
    "routing_hint": "<ver routing_hint abajo>",
    "tags": ["señales snake_case; ver vocabulario abajo"],
    "context_areas": ["claves de Áreas HIS válidas, o []"],
    "extractions": [
      {
        "span": "fragmento mencionado (no palabras sueltas)",
        "category": "<ver categorías extracción>",
        "synonyms": ["0-2 variantes ortográficas o abreviaturas"]
      }
    ]
  }

  Un eje por campo (no repitas el mismo caso en los tres):
  - routing_hint = cómo enrutar (eje).
  - context_areas = qué ámbito HIS cargar (solo claves de la lista).
  - tags = señales finas para el catálogo (vocabulario abajo + claves de context_areas activas).

  routing_hint (exactamente uno):
  {routing_hints_list}

  context_areas:
  - Solo claves de "Áreas HIS válidas".
  - Saludo o sin tema HIS → [].
  - Síntoma / malestar / alarma (dolor, pecho, tos, fiebre…): NO uses clinical_record
    salvo que el usuario pregunte explícitamente por su historial, alergias o medicación.
  - clinical_record = consultar resumen clínico ya cargado, no pedir datos al usuario.

  tags (snake_case; las que apliquen):
  - Incluí cada clave de context_areas activa.
  - Vocabulario operacional: {preprocess_tags_vocabulary}.

  Categorías extracción (category en extractions; solo claves de la lista):
  {extraction_categories_list}

  Otras:    
  - extractions: span = fragmento literal del mensaje; 0-2 synonyms por ítem.

  Áreas HIS válidas:
  {context_his_areas_list}

  Historial reciente (más antiguo → más reciente):
  {conversation_history}

  Mensaje actual:
