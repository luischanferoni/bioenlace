# =============================================================================
# Panel de inicio — manifiesto de composición UI (NO es RBAC)
# =============================================================================
#
# Consumidores:
#   - Web staff     → site/index (audiencia staff + encounter_class en sesión)
#   - App Personal de Salud (staff) → GET /api/v1/home/panel
#   - App Paciente (móvil) → GET /api/v1/home/panel (audiencia patient)
#
# La web NO tiene superficie paciente: el bloque `panels.patient` aplica solo
# cuando HomePanelAudienceResolver resuelve audiencia «patient» (rol paciente,
# sin rol staff ni sesión operativa EMER/AMB/IMP/VR).
#
# Resolución (HomePanelManifest::resolve):
#   staff + encounter_class EMER|AMB|VR|IMP → panels.staff.<clase>
#   staff sin encounter_class               → panels.staff_operations
#   patient (solo móvil)                    → panels.patient
#   invitado / sin contexto                 → panels.fallback
#
# RBAC HTTP: capability YAML (guardia.*, panel.*) — sync a auth_item.
# Este archivo solo define layout, secciones y CTAs EMER (capability_id + exclusiones UX).
#
# IMP: sub-variantes imp_surgical / imp_floor las resuelve HomePanelStaffPanelSliceRegistry.
# =============================================================================

audience:
  # Roles Yii que cuentan como «staff» para el panel clínico
  staff_roles:
    - Medico
    - enfermeria
    - Administrativo
    - AdminEfector
    - facturista
    - nivelCentral
  # Rol único paciente (app móvil; no web)
  patient_role: paciente

panels:
  # --- Staff con encounter_class fijado en sesión operativa ---
  staff:
    EMER:
      layout: clinical_board
      title: Tablero de guardia
      # CTAs tablero: capability_id + knobs UX (no sustituyen grants en auth_item)
      capabilities:
        triage: guardia.triage
        triage_ui_exclude_roles:
          - Medico
        ingreso: guardia.ingreso
        ingreso_dni_clients:
          - mobile
          - web
        atender: guardia.atender
        atender_exclude_roles:
          - Administrativo
          - AdminEfector
        documentar: encounter.documentar_nota
        retiro_administrativo: guardia.retiro_administrativo
        retiro_clinico: guardia.egreso_clinico
      sections:
        - id: staff_cobertura_activa
          provider: staff_cobertura_activa
          kind: staff_cobertura_activa
          poll_interval_seconds: 60
        - id: staff_guardia_kpis
          provider: staff_guardia_kpis
          kind: staff_kpi_group
        - id: emergency_board
          provider: emergency_board
          kind: emergency_board
          poll_interval_seconds: 30

    AMB:
      layout: clinical_list
      title: Pacientes del día
      sections:
        - id: staff_agenda_kpis
          provider: staff_agenda_kpis
          kind: staff_kpi_group
        - id: appointments_day
          provider: appointments_day
          kind: appointments_day

    VR:
      layout: clinical_list
      title: Consultas clínicas por mensaje
      sections:
        - id: async_consultations_queue
          provider: async_consultations_queue
          kind: async_consultations_queue

    IMP:
      layout: clinical_list
      title: Internación
      # Slice registry elige imp_surgical vs imp_floor según servicio/sesión
      imp_surgical:
        sections:
          - id: staff_surgery_kpis
            provider: staff_surgery_kpis
            kind: staff_kpi_group
          - id: surgeries_day
            provider: surgeries_day
            kind: surgeries_day
      imp_floor:
        sections:
          - id: staff_cobertura_activa
            provider: staff_cobertura_activa
            kind: staff_cobertura_activa
            poll_interval_seconds: 60
          - id: staff_internacion_kpis
            provider: staff_internacion_kpis
            kind: staff_kpi_group
          - id: inpatients
            provider: inpatients
            kind: inpatients

  # Staff logueado sin encounter_class (elegir modalidad / efector)
  staff_operations:
    layout: staff_dashboard
    title: Panel operativo
    sections:
      - id: staff_session_context
        provider: staff_session_context
        kind: staff_session_context
      - id: staff_efector_modalidad_kpis
        provider: staff_efector_modalidad_kpis
        kind: staff_kpi_group
      - id: staff_agenda_kpis
        provider: staff_agenda_kpis
        kind: staff_kpi_group
      - id: staff_guardia_kpis
        provider: staff_guardia_kpis
        kind: staff_kpi_group
      - id: staff_internacion_kpis
        provider: staff_internacion_kpis
        kind: staff_kpi_group

  fallback:
    layout: staff_dashboard
    title: Panel operativo
    sections: []

  # --- Solo app móvil paciente (HomePanelAudienceResolver → patient) ---
  patient:
    layout: patient_home
    title: Inicio
    sections:
      - id: patient_async_consultations
        provider: patient_async_consultations
        kind: patient_async_consultations
      - id: upcoming_appointments
        provider: patient_upcoming_appointments
        kind: patient_upcoming_appointments
      - id: conditions_active
        provider: patient_conditions_active
        kind: patient_conditions_active
      - id: care_plans_active
        provider: patient_care_plans_active
        kind: patient_care_plans_active
