# Reglas de contexto cliente web vs móvil (Bioenlace / salud).
# {@see ClientContextMetadata} — no hardcodear intents de paciente en Platform.
version: 1

mobile_paciente:
  app_client_ids:
    - paciente-flutter
  shortcut_display:
    mode: rbac
    omit_subgroups: true

whatsapp_paciente:
  app_client_ids:
    - whatsapp-paciente
  shortcut_display:
    mode: rbac
    omit_subgroups: true

web_staff:
  hide_servicio_navbar_roles:
    - Administrativo

  hide_paciente_flows:
    intent_ids:
      - atencion.necesito-atencion
      - personas.designar-representante-flow
      - personas.vincular-menor-flow
      - care-packs.asistencia-pre-consulta-flow
    intent_id_contains:
      - como-paciente
      - '-paciente-'
    rbac_route_contains:
      - como-paciente

  hide_notification_tipos:
    - TURNO_REQUIERE_REUBICACION
    - TURNO_CANCELADO_EFECTOR
    - TURNO_RECORDATORIO
    - TURNO_CONFIRMAR
    - TURNO_TRANSPORT_HINT
    - TURNO_REMINDER
