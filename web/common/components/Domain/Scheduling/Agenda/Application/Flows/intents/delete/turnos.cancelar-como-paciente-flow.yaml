intent_id: turnos.cancelar-como-paciente-flow
version: 1
action_name: 'Cancelar turno'
rbac_route: /api/turnos/cancelar-como-paciente
keywords:
  - 'cancelar turno'
  - 'anular turno'
  - 'dar de baja turno'
  - 'no puedo ir al turno'
intent_semantics:
  objective: 'Cancelá un turno pendiente propio eligiendo el turno y el motivo.'
  capabilities:
    - ver_turnos_propios
    - cancelar_turno_propio
initial: select_turno
states:
  select_turno:
    description: 'Turno a cancelar'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: select_motivo
  select_motivo:
    description: 'Motivo de la cancelación'
    meta:
      provides:
        - draft.razon_cancelacion
      requires:
        - draft.id
      open_ui:
        action_id: turnos.elegir-motivo-cancelacion-como-paciente
        params:
          id: draft.id
    type: final
flow_submit:
  action_id: turnos.cancelar-como-paciente
  params:
    id: draft.id
    razon_cancelacion: draft.razon_cancelacion
