intent_id: licencia.cargar-como-profesional-flow
version: 1
operation: create
intent_family: licencia.cargar
domain_operation: ProfesionalEfectorServicio.condicion_laboral_own
subject_resolution:
  handler: organization.pes_own_in_efector
fields:
  -
    name: id_servicio
  -
    name: fecha_inicio
  -
    name: fecha_fin
  -
    name: ui_step
  -
    name: confirmar_impacto_turnos
action_name: 'Mi licencia'
rbac_route: /api/profesional-efector-servicio/cargar-licencia-como-profesional-flow
keywords:
  - licencia
  - 'cargar licencia'
  - 'solicitar licencia'
  - 'pedir licencia'
  - permiso
  - vacaciones
  - ausencia
  - 'licencia médica'
  - 'licencia medica'
  - 'darme de baja'
  - 'avisar que no voy a trabajar un período'
  - 'registrar vacaciones o licencia en mi servicio'
  - 'informar ausencia programada'
intent_semantics:
  objective: 'Registrar una licencia, permiso o ausencia (solo fechas de inicio y fin) sobre una asignación propia PES en el efector.'
context:
  - condicion_laboral_ui_completed
draft_hydrator:
  handler: organization.pes_from_servicio
  require_own_pes: true
business_rules:
  -
    id: licencia_propia_vs_staff
    when: pre_flow
    checker: content_regex
    require_any:
      - 'licencia|permiso|vacacion|vacaciones|ausencia|franco|darme de baja'
    forbid_any:
      - 'otro|otra|del médico|del medico|del doctor|del profesional|para el|para la|secretaría|secretaria'
      - 'formas?\s+de\s+atencion|forma\s+de\s+atencion|agenda|horario|teleconsulta|intervalo'
    user_message: '¿Querés cargar una licencia propia o la de otro profesional del efector?'
    remediation:
      -
        id: mi_licencia
        label: 'Mi licencia (mis servicios)'
        intent_id: licencia.cargar-como-profesional-flow
        reset_flow: true
      -
        id: otro_profesional
        label: 'Licencia de otro profesional (staff)'
        intent_id: licencia.cargar-para-profesional-flow
        reset_flow: true
initial: select_servicio
states:
  select_servicio:
    description: Servicio
    meta:
      provides:
        - draft.id_servicio
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: profesional-efector-servicio.listar-mis-servicios-en-efector
        params:
          incluir_sin_agenda: '1'
    always: cargar_licencia
  cargar_licencia:
    description: Licencia
    meta:
      provides:
        - draft.condicion_laboral_ui_completed
        - draft.fecha_inicio
        - draft.fecha_fin
      requires:
        - draft.id_profesional_efector_servicio
        - draft.id_servicio
      open_ui:
        action_id: profesional-efector-servicio.cargar-licencia-como-profesional
        params:
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          id_servicio: draft.id_servicio
    type: final
flow_submit:
  action_id: profesional-efector-servicio.cargar-licencia-como-profesional-flow
  params:
    id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    id_servicio: draft.id_servicio
    fecha_inicio: draft.fecha_inicio
    fecha_fin: draft.fecha_fin
