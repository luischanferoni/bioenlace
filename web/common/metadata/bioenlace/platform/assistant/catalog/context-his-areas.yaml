# Tipo: catalog
# Propósito: áreas HIS (context_areas) — id → texto para prompts.
# Consumidor: AssistantContextHISArea / preprocess + guide.
# No poner aquí: mapas técnicos ni alias id→id (van en el loader PHP si hacen falta).
version: 1

areas:
  appointments: Citas y turnos del paciente; reglas del centro sobre citas
  encounters: Atenciones y consultas ya realizadas
  clinical_record: Resumen clínico del paciente (alergias, medicación, condiciones)
  diagnostics: Estudios, laboratorio y resultados
  medication: Recetas y medicación
  representation: Tutela, representantes y operar por otro
  coverage: Cobertura y obra social
  product: Cómo funciona Bioenlace (guías de uso)
  geo_resources: Centros, ubicación y recursos del sistema de salud
