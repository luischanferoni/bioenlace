intent_id: profesional-horarios.gestionar-staff
version: 1
shortcut:
  hidden: true
operation: edit
intent_family: profesional-horarios.gestionar
domain_operation: DataAccess.edit
action_name: 'Horarios de guardia / internación de un profesional'
description: 'Cargar horarios (entrada/salida) de guardia o internación para un profesional del efector. No mezcla con la agenda ambulatoria.'
rbac_route: /api/profesional-horarios/gestionar
keywords:
  - 'horarios de guardia de un profesional'
  - 'horarios de internación de un profesional'
  - 'horarios de piso'
  - 'cargar horarios de plantel'
  - 'horario de guardia de un colega'
  - 'asignar guardia'
  - 'plantel guardia'
  - 'roster internación'
  - 'cobertura de un profesional'
  - 'cargar cobertura de'
  - 'horarios de plantel de un profesional'
  - 'plantel de guardia de un profesional'
intent_semantics:
  summary: 'Cargar horarios EMER/IMP de un profesional del efector.'
subintents:
  -
    id: select_profesional
    assistant_text: 'Elegí el profesional'
    provides:
      - draft.id_profesional_efector_servicio
    next: select_pes
    open_ui:
      action_id: profesional-efector-servicio.listar-por-efector
  -
    id: select_pes
    assistant_text: 'Elegí el servicio / asignación'
    requires:
      - draft.id_profesional_efector_servicio
    provides:
      - draft.id_profesional_efector_servicio
    next: gestionar_horario
    open_ui:
      action_id: profesional-horarios.elegir-pes
      params:
        modo: staff
        id_profesional_efector_servicio: draft.id_profesional_efector_servicio
  -
    id: gestionar_horario
    assistant_text: 'Completá los horarios'
    requires:
      - draft.id_profesional_efector_servicio
    provides:
      - draft.horario_ui_completed
    next: ''
    open_ui:
      action_id: profesional-horarios.gestionar
      params:
        modo: staff
        id_profesional_efector_servicio: draft.id_profesional_efector_servicio
