intent_id: internacion.ingreso-flow
version: 1
shortcut:
  hidden: true
action_name: 'Ingreso a internación'
rbac_route: /api/home/panel

guide:
  funcionalidad: 'Permite al staff registrar el ingreso de un paciente a internación. El flujo abre el formulario para completar datos del ingreso incluyendo cama, guardia de origen, profesional responsable, fecha, hora y condiciones de derivación. El resultado final es el ingreso registrado en el sistema.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Ingreso a internación registrado con todos los datos requeridos.
    - Asignación de cama y profesional responsable al paciente.

initial: ingresar
states:
  ingresar:
    label: 'Completá los datos del ingreso'
    description: 'Datos del ingreso a internación'
    explanation: 'La persona elige datos del ingreso a internación.'
    meta:
      tags:
        - internacion
        - ingreso
        - hospitalizacion
        - piso
      provides:
        - draft.internacion_id
      requires:
        - draft.id_persona
      open_ui:
        action_id: clinical.internacion.ingreso-formulario
        params:
          id_persona: draft.id_persona
          id_cama: draft.id_cama
          id_guardia: draft.id_guardia
    outcome: 'Termina cuando la persona registra el ingreso.'
    type: final
flow_submit:
  action_id: clinical.internacion.ingreso-formulario
  params:
    id_persona: draft.id_persona
    id_cama: draft.id_cama
    id_guardia: draft.id_guardia
    id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    fecha_inicio: draft.fecha_inicio
    hora_inicio: draft.hora_inicio
    id_tipo_ingreso: draft.id_tipo_ingreso
    id_efector_origen: draft.id_efector_origen
    ingresa_en: draft.ingresa_en
    ingresa_con: draft.ingresa_con
    datos_contacto_nombre: draft.datos_contacto_nombre
    datos_contacto_tel: draft.datos_contacto_tel
    situacion_al_ingresar: draft.situacion_al_ingresar
    obra_social: draft.obra_social
    condiciones_derivacion: draft.condiciones_derivacion

