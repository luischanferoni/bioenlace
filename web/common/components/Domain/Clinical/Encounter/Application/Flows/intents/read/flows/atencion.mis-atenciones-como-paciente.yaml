intent_id: atencion.mis-atenciones-como-paciente
version: 1
action_name: 'Ver mis atenciones'
rbac_route: /api/clinical/encounter-patient-summary/listar-atenciones-como-paciente

intent_semantics:
  objective: 'Revisá tus atenciones ambulatorias finalizadas y el resumen de cada una.'
initial: ver_listado
states:
  ver_listado:
    description: 'Elegí una atención'
    meta:
      tags:
        - atenciones
      provides:
        - draft.encounter_id
      open_ui:
        action_id: clinical.encounter.mis-atenciones-como-paciente
    always: ver_detalle
  ver_detalle:
    description: 'Resumen de la atención'
    meta:
      requires:
        - draft.encounter_id
      open_ui:
        action_id: clinical.encounter.ver-resumen-atencion-como-paciente
        params:
          encounter_id: draft.encounter_id
    type: final

