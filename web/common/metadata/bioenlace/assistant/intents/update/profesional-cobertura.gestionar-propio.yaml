intent_id: profesional-cobertura.gestionar-propio
version: 1
shortcut:
  hidden: true
operation: edit
intent_family: profesional-cobertura.gestionar
domain_operation: DataAccess.edit
action_name: 'Cargar mi cobertura (guardia / internación)'
description: 'Patrón semanal de plantel EMER/IMP con vigencia. Preferí «Mis horarios» si también configurás ambulatorio.'
rbac_route: /api/profesional-cobertura/gestionar
keywords: {  }
intent_semantics:
  summary: 'Declarar cobertura propia de urgencia o internación (patrón semanal).'
draft_hydrator:
  handler: organization.pes_from_servicio
  require_own_pes: true
subintents:
  -
    id: select_pes
    assistant_text: 'Elegí el servicio / asignación'
    provides:
      - draft.id_profesional_efector_servicio
    next: select_encounter_class
    open_ui:
      action_id: profesional-cobertura.elegir-pes
      params:
        modo: propio
  -
    id: select_encounter_class
    assistant_text: '¿Guardia o internación?'
    requires:
      - draft.id_profesional_efector_servicio
    provides:
      - draft.encounter_class
    next: gestionar_cobertura
    open_ui:
      action_id: profesional-cobertura.elegir-encounter-class
      params:
        solo_cobertura: '1'
  -
    id: gestionar_cobertura
    assistant_text: 'Completá el patrón semanal de cobertura'
    requires:
      - draft.id_profesional_efector_servicio
      - draft.encounter_class
    provides:
      - draft.cobertura_ui_completed
    next: ''
    open_ui:
      action_id: profesional-cobertura.gestionar
      params:
        modo: propio
        id_profesional_efector_servicio: draft.id_profesional_efector_servicio
        encounter_class: draft.encounter_class
