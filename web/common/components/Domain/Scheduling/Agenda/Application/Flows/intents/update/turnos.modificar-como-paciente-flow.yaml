intent_id: turnos.modificar-como-paciente-flow
version: 1
action_name: 'Cambiar horario de turno'
rbac_route: /api/turnos/reprogramar-como-paciente

initial: select_turno
states:
  select_turno:
    label: Turno a modificar
    description: 'Turno pendiente que se cambia'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: select_slot
  select_slot:
    label: Nuevo horario
    description: 'Nuevo horario del turno'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id
      open_ui:
        action_id: turnos.slots-reprogramar-como-paciente
        params:
          id: draft.id
    type: final
flow_submit:
  action_id: turnos.reprogramar-como-paciente
  params:
    id: draft.id
    slot_id: draft.slot_id

