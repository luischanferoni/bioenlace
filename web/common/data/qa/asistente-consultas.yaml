# Catálogo ejecutable de consultas al asistente (paciente).
# Fuente humana: web/docs/qa/paciente/asistente-consultas.md
# Runner: php yii qa/asistente-consultas --userId=<id>
#
# secciones: smoke | orientacion | pedir-atencion | citas | post-consulta | no-confundir | borde
#   smoke = humo mínimo (dominios distintos a propósito: análisis ≠ recetas ≠ atenciones)
#   borde = cadenas, desvíos de hilo, preguntas mixtas / agresivas de formato
#
# cobertura: Hoy | Pantalla | Fuera | Futuro
# expect (opcional, evaluado en el último mensaje del caso):
#   user_goal / user_goals_any
#   intent_id / intent_ids_any  (flow.intent_id o buttons[].intent_id)
#   must_not_intent             (lista)
#   offer_intent                (debe aparecer en buttons)
#   must_not_offer_intent
#   reply_must_not_contain      (subcadenas case-insensitive)

version: 1
source_doc: web/docs/qa/paciente/asistente-consultas.md

cases:
  # --- Smoke mínimo (asistente.md) ---
  - id: smoke-quiero-turno
    seccion: smoke
    tipo: Solo sacar turno
    cobertura: Hoy
    mensajes:
      - Quiero un turno
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.crear-como-paciente
      must_not_intent:
        - atencion.necesito-atencion

  - id: smoke-sintoma-cabeza
    seccion: smoke
    tipo: Síntoma
    cobertura: Hoy
    mensajes:
      - Me duele la cabeza
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion
      must_not_intent:
        - turnos.crear-como-paciente

  - id: smoke-cancelar-turno
    seccion: smoke
    tipo: Cancelar
    cobertura: Hoy
    mensajes:
      - Cancelá el turno del martes
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.cancelar-como-paciente-flow

  - id: smoke-mis-analisis
    seccion: smoke
    tipo: Mis análisis (resultados lab — no confundir con “mis recetas”)
    cobertura: Hoy
    mensajes:
      - Mis análisis
    expect:
      user_goal: operational
      intent_ids_any:
        - laboratorio.ver-resultados-como-paciente

  - id: smoke-mis-recetas
    seccion: smoke
    tipo: Mis recetas (medicación — dominio distinto a laboratorio)
    cobertura: Hoy
    mensajes:
      - Mis recetas
    expect:
      user_goal: operational
      intent_ids_any:
        - receta.ver-recetas-como-paciente

  - id: smoke-mis-atenciones
    seccion: smoke
    tipo: Mis atenciones
    cobertura: Hoy
    mensajes:
      - Mis atenciones
    expect:
      user_goal: operational
      intent_ids_any:
        - atencion.mis-atenciones-como-paciente

  # --- 1. Orientación / guide ---
  - id: guide-sintoma
    seccion: orientacion
    tipo: Síntoma
    cobertura: Hoy
    mensajes:
      - Me duele la cabeza desde anoche
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion
      must_not_intent:
