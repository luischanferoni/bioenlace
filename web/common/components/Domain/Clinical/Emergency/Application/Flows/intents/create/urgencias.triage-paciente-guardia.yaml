intent_id: urgencias.triage-paciente-guardia
version: 1
action_name: 'Triage en guardia'
rbac_route: /api/home/panel
keywords:
  - triage
  - 'clasificar urgencia'
  - 'prioridad guardia'
  - manchester
  - 'enfermería triage'
initial: elegir_paciente
states:
  elegir_paciente:
    description: 'Elegí el paciente en guardia pendiente de triage'
    meta:
      provides:
        - draft.guardia_id
      open_ui:
        action_id: clinical.emergency-guardia.elegir-paciente-triage
    always: registrar_triage
  registrar_triage:
    description: 'Completá nivel (1–5), motivo y signos vitales si corresponde'
    meta:
      requires:
        - draft.guardia_id
      open_ui:
        action_id: clinical.emergency-guardia.registrar-triage-formulario
        params:
          guardia_id: draft.guardia_id
    type: final
flow_submit:
  action_id: clinical.emergency-guardia.registrar-triage-formulario
  params:
    guardia_id: draft.guardia_id
    level: draft.level
    reason_text: draft.reason_text
    bp_sys: draft.bp_sys
    bp_dia: draft.bp_dia
    hr: draft.hr
