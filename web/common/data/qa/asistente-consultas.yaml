    tipo: Sesión con medium (no clínica)
    cobertura: Fuera
    mensajes:
      - Necesito una sesión con una medium
    expect:
      must_not_offer_intent: atencion.necesito-atencion
      must_not_intent:
        - turnos.crear-como-paciente
        - atencion.necesito-atencion

  - id: borde-multa-si-no-voy
