intent_id: turnos.reubicar-como-paciente-flow
version: 1
action_name: 'Reubicar turno'
rbac_route: /api/turnos/reubicar-como-paciente
keywords:
  - 'reubicar turno'
  - 'turno en resolución'
  - 'cambiar profesional del turno'
  - 'nuevo turno en consultorio'
intent_semantics:
  objective: 'Si tu turno quedó en reubicación, elegí de nuevo servicio, centro, profesional y horario.'
  capabilities:
    - reubicar_turno_propio
    - elige_servicio
    - elige_centro
    - elige_profesional
    - elige_horario
context:
  - id_servicio_asignado
  - id_efector
  - id_profesional_efector_servicio
  - fecha_turno
initial: select_turno
states:
  select_turno:
    description: 'Turno a reubicar'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-en-resolucion-como-paciente
    always: select_servicio
  select_servicio:
    description: Servicio
    meta:
      provides:
        - draft.id_servicio_asignado
      open_ui:
        action_id: servicios.elegir-acepta-turnos
    always: select_efector
  select_efector:
    description: 'Centro de salud'
    meta:
      provides:
        - draft.id_efector
      requires:
        - draft.id_servicio_asignado
      chooser:
        when_user_says_nearby:
          open_ui:
            action_id: efectores.listar-por-servicio-cercano
            params:
              id_servicio: draft.id_servicio_asignado
        otherwise:
          open_ui:
            action_id: efectores.listar-por-servicio
            params:
              id_servicio: draft.id_servicio_asignado
    always: select_profesional
  select_profesional:
    description: Profesional
    meta:
      provides:
        - draft.id_profesional_efector_servicio
      requires:
        - draft.id_efector
        - draft.id_servicio_asignado
      open_ui:
        action_id: profesional-efector-servicio.listar-por-efector-servicio-acepta-turnos
        params:
          id_efector: draft.id_efector
          id_servicio: draft.id_servicio_asignado
    always: select_dia
  select_dia:
    description: Día
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.id
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: turnos.slots-dias-reubicar-como-paciente
        params:
          id: draft.id
          id_efector: draft.id_efector
          id_servicio_asignado: draft.id_servicio_asignado
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          mismo_profesional: '0'
    always: select_slot
  select_slot:
    description: Horario
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id
        - draft.id_profesional_efector_servicio
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-reubicar-como-paciente
        params:
          id: draft.id
          id_efector: draft.id_efector
          id_servicio_asignado: draft.id_servicio_asignado
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          fecha: draft.fecha_turno
          mismo_profesional: '0'
    type: final
flow_submit:
  action_id: turnos.reubicar-como-paciente
  params:
    id: draft.id
    slot_id: draft.slot_id
    id_efector: draft.id_efector
    id_servicio_asignado: draft.id_servicio_asignado
