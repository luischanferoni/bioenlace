intent_id: profesional-horarios.gestionar-staff
version: 1
shortcut:
  hidden: true
operation: edit
intent_family: profesional-horarios.gestionar
domain_operation: DataAccess.edit
action_name: 'Horarios de guardia / internación de un profesional'
rbac_route: /api/profesional-horarios/gestionar

guide:
  funcionalidad: 'Permite al staff configurar los horarios de guardia o internación de otro profesional. El flujo selecciona el profesional, su asignación de servicio y permite configurar las franjas horarias. El resultado final es la configuración de horarios del profesional actualizada.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Horarios de guardia o internación del profesional configurados.
    - Selección del profesional y asignación para gestionar horarios.

initial: select_profesional
states:
  select_profesional:
    label: Elegí el profesional
    description: 'Profesional al que se le cargan horarios'
    explanation: 'La persona elige profesional al que se le cargan horarios.'
    meta:
      tags:
        - horarios_staff
        - agenda_ajena
        - plantel
        - cobertura
      provides:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: profesional-efector-servicio.listar-por-efector
    always: select_pes
  select_pes:
    label: Elegí el servicio / asignación
    description: 'Asignación del profesional'
    explanation: 'La persona elige asignación del profesional.'
    meta:
      tags:
        - horarios_staff
        - asignacion
        - oferta_staff
        - plantel
      provides:
        - draft.id_profesional_efector_servicio
      requires:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: profesional-horarios.elegir-pes
        params:
          modo: staff
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    always: gestionar_horario
  gestionar_horario:
    label: 'Completá los horarios'
    description: 'Horarios de guardia o internación'
    explanation: 'La persona elige horarios de guardia o internación.'
    meta:
      tags:
        - horarios_staff
        - franja_staff
        - intervalo
        - cupos_staff
      provides:
        - draft.horario_ui_completed
      requires:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: profesional-horarios.gestionar
        params:
          modo: staff
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    outcome: 'Termina cuando la persona configura los horarios del profesional.'
    type: final

