# Tipo: prompt
# Propósito: extracción IA de datos clínicos HUMANOS en captura (analizar encounter). Esqueleto genérico:
#            las categorías llegan como variables ({categories_block}, {category_semantics}); no se listan aquí.
# Consumidor: ClinicalTextIaMetadata::buildEncounterCaptureExtractionPrompt (clave `clinical.capture_extraction`)
# Variante veterinaria: Domain/Veterinary/Capture/Prompts/capture-extraction.yaml (mismo contrato de salida).
# Política de post-proceso y léxico: ../Policy/capture-policy.yaml (no es prompt).
version: 2

encounter_capture_extraction:
  prompt_template: |
    Extraé datos clínicos en JSON válido y completo (cerrá todas las llaves, corchetes y comillas).

    OBLIGATORIO: la respuesta debe incluir SIEMPRE la clave raíz "texto_procesado" (string) además de "datosExtraidos".
    Sin "texto_procesado" la respuesta es inválida.

    {classification_rules}

    Categorías (usá exactamente estos nombres como claves dentro de datosExtraidos):
    {categories_block}

    Reglas de formato:
    - Sin datos para una categoría: [].
    - No repitas el mismo dato en más de una categoría.
    - Formato JSON exacto:
      {
        "texto_procesado": "nota clínica corregida…",
        "datosExtraidos": {"Motivos de consulta": ["…"], "Diagnóstico": ["…"]}
      }
    - Categorías SIN subdatos: array de strings cortos y específicos (no copies párrafos enteros).
    - Categorías CON subdatos: array de OBJETOS usando exactamente las claves listadas en subdatos. NO uses un string único que mezcle toda la indicación.
    {structured_examples_block}
    - Tipos de frecuencia admitidos: {frecuencia_tipos}.
    - Tipos de duración admitidos: {duracion_tipos}.

    Reglas para texto_procesado:
    - Reescribí la misma nota del profesional, más clara y correcta; no es un copy-paste del original.
    - Restaurá/correjí ortografía y tildes en español.
    - Expandí abreviaturas médicas habituales cuando aporte claridad (TA→tensión arterial). Si hay abreviaturas ambiguas listadas más abajo, elegí la expansión según el contexto.
    - Mejorá puntuación y mayúsculas; mantené cifras y dosis exactas del original.
    - Sin agregar hallazgos, fármacos, dosis ni indicaciones que no estén en el texto.
    - Sin markdown.

    {patient_context}
    {abbreviations_block}

    Texto clínico: "{clinical_text}"

    Respondé SOLO con el JSON (con texto_procesado Y datosExtraidos), sin texto adicional antes o después.
  # Encabezado del bloque de abreviaturas ambiguas (solo si el texto contiene alguna).
  abbreviations_header: 'Abreviaturas ambiguas detectadas en el texto (opciones posibles; elegí la que corresponda al contexto):'
  classification_rules_template: |
    Reglas de clasificación (obligatorias):
    - No dupliques un mismo dato en más de una categoría.
    - Clasificá cada fragmento según la semántica de su categoría:
    {category_semantics}
    - Si el texto no tiene interpretación clínica (objetos cotidianos, palabras sin sentido médico, bromas, etc.), dejá todas las categorías en [].
    - Objetos cotidianos sin relación clínica (pelota, auto, mesa, etc.) no van en ninguna categoría.
    - No inventes motivos de consulta ni diagnósticos que el texto no sustente clínicamente.
    - Un término aislado que nombra una enfermedad o condición médica va en diagnóstico, no en motivos de consulta.
    - Si el texto narra un síntoma o queja (dolor, cefalea, tos, etc.) y además un diagnóstico, el síntoma va en Motivos y el diagnóstico en Diagnóstico (no omitas el Motivo).
  # Semántica por categoría (clave = modelo). Pendiente de migrar a la definición de cada categoría.
  category_hints:
    EncounterReason: queja o síntoma referido (cefalea, dolor, malestar, etc.); no lo dejes vacío si el texto lo menciona
    EncounterDiagnosis: diagnóstico, evolución o enfermedad nombrada por el profesional
    EncounterMedication: medicación mencionada o indicada; objetos Nombre+Tipo(mentioned|ordered)+Cantidad+Via+Frecuencia+tipos/duración — si Tipo=ordered exigir Cantidad y Frecuencia; mentioned basta el nombre
    EncounterPractice: mediciones o prácticas realizadas en el encounter (ECG, etc.); objetos Practica+Resultado+Codigo — Resultado y Codigo opcionales; nunca reposo/dieta/control; las cifras de signos vitales (TA, FC, FR, SatO2, temp) van en EncounterNursingCare
    EncounterReferralRequest: derivación/pedido a otro servicio del centro O conducta de guardia (pase a internación/UCI, derivación a otra institución); campos Servicio (área institucional), Acto, Modo (consulta|interconsulta|practica|estudio); si el profesional indica internar / UCI / cama, dejalo explícito en Servicio o Acto (p. ej. "internación")
    EncounterInstruction: instrucciones al paciente (reposo, hidratación, control, alta domiciliaria, pautas de alarma); objetos Indicacion+Tipo(counseling|conditional|follow_up)+Plazo dias — plazo solo si Tipo=follow_up o hay días explícitos; nunca signos vitales ni TA; en guardia, si da el alta o indica control, reflejalo acá
    EncounterNursingCare: signos vitales medidos o dictados durante el encounter (TA sistólica/diastólica, FC, FR, saturación O2, temperatura, glucemia, Glasgow, peso, talla); sugerí cargarlos si el profesional menciona cifras o si faltan en el episodio
    OphthalmologyPractice: práctica o procedimiento oftalmológico
    OphthalmologyStudy: estudio oftalmológico solicitado o realizado
    OphthalmologyLensPrescription: receta o indicación de lentes
    EncounterDentalPractice: práctica odontológica
    EncounterDentalDiagnosis: diagnóstico odontológico
    EncounterDentalStatus: estado dental o pieza
    EncounterNutritionOrder: régimen o indicación de internación
    EncounterFluidBalance: balance hídrico
