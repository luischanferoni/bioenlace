intent_id: paciente-contexto.recurso-provincial-como-paciente-flow
version: 1
action_name: 'Recurso de salud en tu provincia'
rbac_route: /api/paciente-contexto/buscar-recurso-provincial-como-paciente

guide:
  funcionalidad: 'Permite al paciente buscar recursos de salud disponibles en su provincia de contexto. El flujo busca en la cartilla provincial según el tipo de recurso consultado. El resultado final es la visualización del recurso encontrado.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Visualización de recursos de salud de la provincia.
    - Búsqueda de cartilla o red de servicios provinciales.

draft_hydrator:
  handler: person.paciente_recurso_provincial
initial: buscar
states:
  buscar:
    label: Busco el recurso en tu provincia de contexto.
    description: 'Recurso de salud de la provincia de la persona'
    explanation: 'La persona consulta un recurso de salud de la provincia.'
    meta:
      tags:
        - recurso
        - provincial
        - cartilla
        - red
    outcome: 'Termina cuando la persona ve el recurso de salud.'
    type: final
flow_submit:
  action_id: paciente-contexto.buscar-recurso-provincial-como-paciente
  params:
    q: draft.q
    tipo: draft.tipo

