intent_id: turnos.cancelar-para-paciente-flow
version: 1
action_name: 'Cancelar turno (gestión)'
rbac_route: /api/turnos/cancelar-operativo

initial: cancelar
states:
  cancelar:
    label: Turno a cancelar
    description: 'Turno pendiente que se cancela'
    explanation: 'La persona elige turno pendiente que se cancela.'
    meta:
      tags:
        - cancelacion_staff
        - anular_staff
        - baja_turno_staff
        - ausente
      provides:
        - draft.id
        - draft.razon_cancelacion
        - draft.canal
      open_ui:
        action_id: turnos.cancelar-operativo
    outcome: 'Termina cuando la persona cancela el turno.'
    type: final
flow_submit:
  action_id: turnos.cancelar-operativo
  params:
    id: draft.id
    razon_cancelacion: draft.razon_cancelacion
    canal: draft.canal

