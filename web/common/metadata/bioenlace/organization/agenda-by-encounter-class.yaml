# Tipo: knob
# Propósito: agenda tipada por encounter_class (FHIR).
# Consumidor: ProductMetadataPaths::agendaByEncounterClassFile()
# No poner aquí: reglas de cupo/persistencia (dominio Scheduling).
# AMB = cupos reservables (paciente). EMER/IMP = horario de presencia (solo staff).
version: 1

kinds:
  AMB:
    storage: pes_slot_agenda
    capacity_model: weekly_slots
    patient_booking: true
    label: Ambulatorio (cupos)
    description: >
      Grilla semanal por PES con intervalo fijo. Única agenda expuesta a pacientes
      para solicitar turnos.
  EMER:
    storage: horario_interval
    capacity_model: weekly_presence
    patient_booking: false
    service_filter: optional
    label: Urgencia / guardia (horarios)
    description: >
      Plantilla semanal de horarios (entrada/salida por día) materializada a intervalos.
      Servicio opcional como filtro de ámbito. No genera cupos ni filas en turnos de paciente.
  IMP:
    storage: horario_interval
    capacity_model: weekly_presence
    patient_booking: false
    service_filter: optional
    label: Internación (horarios)
    description: >
      Horario de piso con patrón semanal materializado. No genera cupos ni filas en turnos de paciente.

conflicts:
  # Solape de intervalos de horario (EMER/IMP) misma persona + mismo efector.
  horario_overlap_same_persona_efector: true
  # Cruce horario vs grilla AMB: patrón semanal (lunes_2…), no slots generados.
  horario_vs_amb_slots: true

patient_exposure:
  # Solo agendas AMB (y servicios con acepta_turnos) entran al funnel de reserva.
  slot_finder_encounter_classes:
    - AMB
  forbid_horario_in_turnos: true

operational:
  # Asignar / tomar caso en guardia exige horario EMER vigente de esa persona en el efector.
  emer_assign_requires_horario: true
  # Si no hay nadie con horario, permitir asignar igual (piloto / onboarding).
  emer_assign_allow_without_any_presence: false
  # Ver listado de internados (piso) exige horario IMP vigente de la sesión.
  imp_view_requires_horario: true
