# Tipo: copy + knob
# Propósito: prompts y heurísticas de IA para texto clínico (SNOMED, captura, léxico).
# Consumidor: ClinicalTextIaMetadata / ProductMetadataPaths::clinicalTextIaFile()
# No poner aquí: required_when de integridad clínica (modelos *Input Yii).
version: 1

snomed_context:
  categories:
    diagnosticos: diagnósticos médicos, enfermedades, condiciones patológicas, hallazgos clínicos
    sintomas: síntomas, signos, manifestaciones clínicas, motivos de consulta
    medicamentos: medicamentos, fármacos, sustancias farmacológicas, tratamientos
    procedimientos: procedimientos médicos, intervenciones, técnicas diagnósticas, exámenes
  default_category_label: conceptos médicos
  prompt_template: |
    Analiza el siguiente término médico en el contexto de {contexto} y proporciona el término SNOMED CT más apropiado y preciso.

    Término: '{texto}'
    Contexto: {contexto}

    Responde SOLO con el término SNOMED CT más preciso, sin explicaciones adicionales:

encounter_automatic_coding:
  max_diagnosticos: 8
  prompt_template: |
    Sos el motor de codificación diagnóstica del HIS Bioenlace. Debés elegir los códigos oficiales y persistirlos; no sugerís al médico para confirmar.

    {patient_context}

    Texto clínico del encounter (dictado / evolución):
    ---
    {clinical_text}
    ---

    {diagnosis_hints}

    Devolvé SOLO JSON válido con esta forma:
    {
      "diagnosticos": [
        {
          "termino": "nombre del diagnóstico en español",
          "codigo_cie10": "código CIE-10-ES sin espacios (ej. J06.9) o null",
          "codigo_snomed": "conceptId SNOMED CT numérico o null",
          "rol": "principal|secundario",
          "justificacion": "breve cita del texto que sustenta el código"
        }
      ]
    }

    Reglas:
    - Codificá SOLO los ítems listados en «Diagnósticos a codificar». No agregues síntomas, motivos de consulta ni signos vitales como diagnóstico.
    - Si la lista de diagnósticos a codificar está vacía, devolvé {"diagnosticos":[]}.
    - Incluí al menos un diagnóstico principal cuando la lista lo permita.
    - Usá CIE-10-ES cuando corresponda a facturación/epidemiología en Argentina; SNOMED CT para interoperabilidad clínica.
    - Al menos uno de codigo_cie10 o codigo_snomed debe estar presente por ítem.
    - Máximo {max_diagnosticos} diagnósticos.
    - No inventes hallazgos ausentes en el texto.
    - Sin markdown ni texto fuera del JSON.

llm_correction_confidence:
  context_terms:
    - paciente
    - consulta
    - diagnóstico
    - tratamiento
    - medicamento
    - síntoma
    - enfermedad
  context_term_boost: 0.1

# Léxico clínico: overrides opcionales. Defaults de dominio en
# EncounterCaptureExtractionPostProcessPolicy::DEFAULT_LEXICON.
clinical_lexicon:
  # Delimitadores PCRE `/…/iu` (no usar `(?iu)`: en PCRE `u` no es opción inline).
  narrative_framing: '/\b(refiere|vengo\s+por|consulta\s+por|desde\s+hace|presenta|paciente\s+con|me\s+siento|hace\s+\d+|desde\s+ayer|desde\s+hoy)\b/iu'
  subjective_complaint: '/\b(problema|dolor|duele|sintoma|síntoma|malestar|enfermo|fiebre|tos|nausea|náusea|vomito|vómito|mareo|hinchazon|hinchazón|presion|presión|chichon|chichón|golpe|hematoma|moreton|moretón|bulto|hinchado|inflamado|herida|sangra|sangrado|cefalea|astenia|disnea|prurito|cansancio|diarrea)\b/iu'

# Extracción IA en captura clínica (analizar encounter).
# {@see ClinicalTextIaMetadata::buildEncounterCaptureExtractionPrompt}
# {@see EncounterCaptureExtractionPostProcessor}
encounter_capture_extraction:
  prompt_template: |
    Extraé datos clínicos en JSON válido y completo (cerrá todas las llaves, corchetes y comillas).

    OBLIGATORIO: la respuesta debe incluir SIEMPRE la clave raíz "texto_procesado" (string) además de "datosExtraidos".
    Sin "texto_procesado" la respuesta es inválida.

    {classification_rules}

    Categorías (usá exactamente estos nombres como claves dentro de datosExtraidos):
    {categories_block}

    Reglas de formato:
    - Sin datos para una categoría: [].
    - No repitas el mismo dato en más de una categoría.
    - Formato JSON exacto:
      {
        "texto_procesado": "nota clínica corregida…",
        "datosExtraidos": {"Motivos de consulta": ["…"], "Diagnóstico": ["…"]}
      }
    - Categorías SIN subdatos: array de strings cortos y específicos (no copies párrafos enteros).
    - Categorías CON subdatos: array de OBJETOS usando exactamente las claves listadas en subdatos. NO uses un string único que mezcle toda la indicación.
    {structured_examples_block}
    - Tipos de frecuencia admitidos: {frecuencia_tipos}.
    - Tipos de duración admitidos: {duracion_tipos}.

    Reglas para texto_procesado:
    - Reescribí la misma nota del profesional, más clara y correcta; no es un copy-paste del original.
    - Restaurá/correjí ortografía y tildes en español.
    - Expandí abreviaturas médicas habituales cuando aporte claridad (TA→tensión arterial).
    - Mejorá puntuación y mayúsculas; mantené cifras y dosis exactas del original.
    - Sin agregar hallazgos, fármacos, dosis ni indicaciones que no estén en el texto.
    - Sin markdown.

    {patient_context}

    Texto clínico: "{clinical_text}"

    Respondé SOLO con el JSON (con texto_procesado Y datosExtraidos), sin texto adicional antes o después.
  classification_rules_template: |
    Reglas de clasificación (obligatorias):
    - No dupliques un mismo dato en más de una categoría.
    - Clasificá cada fragmento según la semántica de su categoría:
    {category_semantics}
    - Si el texto no tiene interpretación clínica (objetos cotidianos, palabras sin sentido médico, bromas, etc.), dejá todas las categorías en [].
    - Objetos cotidianos sin relación clínica (pelota, auto, mesa, etc.) no van en ninguna categoría.
    - No inventes motivos de consulta ni diagnósticos que el texto no sustente clínicamente.
    - Un término aislado que nombra una enfermedad o condición médica va en diagnóstico, no en motivos de consulta.
    - Si el texto narra un síntoma o queja (dolor, cefalea, tos, etc.) y además un diagnóstico, el síntoma va en Motivos y el diagnóstico en Diagnóstico (no omitas el Motivo).
  category_hints:
    ConsultaMotivos: queja o síntoma referido (cefalea, dolor, malestar, etc.); no lo dejes vacío si el texto lo menciona
    DiagnosticoConsulta: diagnóstico, evolución o enfermedad nombrada por el profesional
    ConsultaMedicamentos: medicación mencionada o indicada; objetos Nombre+Tipo(mentioned|ordered)+Cantidad+Via+Frecuencia+tipos/duración — si Tipo=ordered exigir Cantidad y Frecuencia; mentioned basta el nombre
    ConsultaPracticas: mediciones o prácticas realizadas en la consulta (ECG, etc.); objetos Practica+Resultado+Codigo — Resultado y Codigo opcionales; nunca reposo/dieta/control; las cifras de signos vitales (TA, FC, FR, SatO2, temp) van en ConsultaAtencionesEnfermeria
    ConsultaDerivaciones: derivación/pedido a otro servicio del centro O conducta de guardia (pase a internación/UCI, derivación a otra institución); campos Servicio (área institucional), Acto, Modo (consulta|interconsulta|practica|estudio); si el profesional indica internar / UCI / cama, dejalo explícito en Servicio o Acto (p. ej. "internación")
    ConsultaIndicaciones: instrucciones al paciente (reposo, hidratación, control, alta domiciliaria, pautas de alarma); objetos Indicacion+Tipo(counseling|conditional|follow_up)+Plazo dias — plazo solo si Tipo=follow_up o hay días explícitos; nunca signos vitales ni TA; en guardia, si da el alta o indica control, reflejalo acá
    ConsultaAtencionesEnfermeria: signos vitales medidos o dictados en la atención (TA sistólica/diastólica, FC, FR, saturación O2, temperatura, glucemia, Glasgow, peso, talla); sugerí cargarlos si el profesional menciona cifras o si faltan en el episodio
    ConsultaPracticasOftalmologia: práctica o procedimiento oftalmológico
    ConsultaPracticasOftalmologiaEstudios: estudio oftalmológico solicitado o realizado
    ConsultasRecetaLentes: receta o indicación de lentes
    ConsultaOdontologiaPracticas: práctica odontológica
    ConsultaOdontologiaDiagnosticos: diagnóstico odontológico
    ConsultaOdontologiaEstados: estado dental o pieza
    ConsultaRegimen: régimen o indicación de internación
    ConsultaBalanceHidrico: balance hídrico
  # Overrides de política de post-proceso (defaults en EncounterCaptureExtractionPostProcessPolicy).
  # No es fuente de verdad de integridad clínica: solo knobs operativos.
  post_process:
    motivo_model: ConsultaMotivos
    diagnosis_models:
      - DiagnosticoConsulta
    filter_non_clinical_extractions:
      enabled: true
      strict_category_models:
        - ConsultaMotivos
      terminology_guard_category_models: []
      retain_if_lexicon_keys:
        - narrative_framing
        - subjective_complaint
      validate_terminology: false
      snowstorm_fallback: false
    relocate_isolated_terms:
      enabled: false
      max_words: 5
    backfill_empty_motivos:
      enabled: true
      require_lexicon_key: subjective_complaint
      max_chars: 140
      split_before_patterns:
        - '/\bdiagn[oó]stico\s*:/iu'
        - '/\bindico\b/iu'
        - '/\bindicaci[oó]n\b/iu'
        - '/\breposo\b/iu'
        - '/\bcontrol\b/iu'
