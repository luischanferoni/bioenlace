# Tipo: catalog
# Propósito: routing_hint del preprocess (1ª IA) — lectura del mensaje, no veredicto PHP.
# Consumidor: PreprocessRoutingHintCatalog / ChatPreprocessService.
# Paths de decisión PHP (match 100 %, Guide, botones) no viven aquí.
version: 1

hints:
  pedido_claro: oraciones que expresan una sola necesidad, situación o problema entendible.
  pedido_claro_multiple: dos o más necesidades/situaciones claras y distintas en el mismo mensaje.
  sin_pedido: oracion u oraciones unimembres que no expresa una necesidad, situación o problema entendible
  pedido_fuera_his: oraciones que expresan un tema ajeno al ámbito de la salud.
