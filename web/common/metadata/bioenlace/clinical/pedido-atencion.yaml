# Tipo: knob + catalog
# Propósito: pedido de atención (servicio institucional × acto SNOMED/LOINC).
# Consumidor: ProductMetadataPaths::pedidoAtencionFile() / coding y capacity domain services
# No poner aquí: filas de `servicios` como actos; integrity de PedidoAtencion en Yii/dominio.
#
# Systems admitidos (CodeableConcept). Sin code system local.
allowed_systems:
  - http://snomed.info/sct
  - http://loinc.org
  - http://terminology.hl7.org/CodeSystem/service-type
  - http://terminology.hl7.org/CodeSystem/service-category

# Acto por defecto cuando solo hay línea y el modo no aporta otro código.
defaults_por_modo:
  consulta:
    code: "11429006"
    code_system: http://snomed.info/sct
    display: Consulta
  interconsulta:
    code: "183515008"
    code_system: http://snomed.info/sct
    display: Interconsulta
  practica:
    code: "71388002"
    code_system: http://snomed.info/sct
    display: Práctica
  estudio:
    code: "363679005"
    code_system: http://snomed.info/sct
    display: Estudio de imagen

modos:
  - consulta
  - interconsulta
  - practica
  - estudio

# Capacidad por tipología de oferta (specialty_* / tipo en servicios), no por nombre de fila.
# El acto matchea act_ecl (Snowstorm); se une a linea_acto (excepciones / preferentes).
capacity_rules:
  - specialty_system: http://snomed.info/sct
    specialty_code: "394914008" # Radiology
    act_ecl: "<< 363679005 |Imaging (procedure)|"
  - match_tipo: laboratorio
    act_ecl: "<< 15220000 |Laboratory test|"
  - match_tipo: consulta
    act_ecl: "<< 11429006 |Consultation|"
  - match_tipo: procedimiento
    act_ecl: "<< 91251008 |Physical therapy procedure|"

# Habla paciente → acto (chips en español). El FSN SNOMED sigue en `actos_clinicos.display`.
acto_nl_aliases:
  - code: "16310003"
    code_system: http://snomed.info/sct
    label: Ecografía
    aliases:
      - ecografia
      - eco
      - ultrasonido
      - ultrasonografia
      - ultrasonography
      - ultrasound
  - code: "363680008"
    code_system: http://snomed.info/sct
    label: Radiografía
    aliases:
      - radiografia
      - rayos x
      - rayos
      - radiographic
  - code: "71651007"
    code_system: http://snomed.info/sct
    label: Mamografía
    aliases:
      - mamografia
      - mammography
  - code: "15220000"
    code_system: http://snomed.info/sct
    label: Laboratorio
    aliases:
      - laboratorio
      - analisis
      - analisis de sangre
      - analisis de orina
      - laboratory
  - code: "91251008"
    code_system: http://snomed.info/sct
    label: Kinesiología
    aliases:
      - kinesio
      - kinesiologia
      - fisioterapia
      - rehabilitacion
      - physical therapy

# Texto libre de la IA / dictado → tipología de oferta (specialty_*).
# Luego se resuelve a filas `servicios` con ese código (único → ítem; 0/N → se descarta el ítem).
# No mapear apodos a nombres de fila (MED CLINICA); el vínculo es tipológico.
linea_nl_aliases:
  - specialty_code: "394807007" # Internal medicine
    specialty_system: http://snomed.info/sct
    aliases:
      - clinico
      - clínico
      - medico clinico
      - médico clínico
      - medicina clinica
      - medicina clínica
      - med clinica
      - med clínica
  - specialty_code: "394814009" # General practice
    specialty_system: http://snomed.info/sct
    aliases:
      - medico general
      - médico general
      - medicina general
      - med general
      - generalista

# Codificación de Acto display (canal staff) — categoría SnomedCategoryCatalog / search profile.
acto_coding:
  snomed_category: procedimientos
  snowstorm_profile: procedimientos
  candidate_limit: 8
