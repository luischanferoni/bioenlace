# Tipo: prompt
# Propósito: elegir la expansión correcta de una abreviatura médica según el contexto.
# Consumidor: AbreviaturasMedicas::desambiguarConLLM
# Placeholders: abreviatura, contexto, opciones (lista numerada, una por línea, terminada en salto de línea)
version: 1

template: |-
  Eres un especialista médico. Dada la abreviatura '{abreviatura}' en el siguiente contexto, elige la expansión más apropiada:

  Contexto: {contexto}

  Opciones:
  {opciones}
  Responde SOLO con el número de la opción correcta:
