# Contrato JSON — 1ª IA (etiquetado). Consumidor: ChatPreprocessService.
# ADR: web/docs/decisions/asistente-catalogo-inteligente.md
version: 2

description: >
  Respuesta exclusivamente JSON del preprocess. Mensaje + historial reciente en el prompt;
  sin catálogo de funcionalidades completo. Las áreas de contexto las deriva PHP
  del match (carpeta del intent), no la 1ª IA.

required:
  - normalized_text
  - necesidad_usuario
  - routing_hint
  - tags
  - extractions

fields:
  normalized_text:
    type: string
    notes: Ortografía corregida; sentido conservado.
  necesidad_usuario:
    type: string
    notes: Una frase operativa (primer pedido si hay varios); obligatoria siempre.
  necesidades_usuario:
    type: list<string>
    optional: true
    notes: >
      Si routing_hint = pedido_claro_multiple, lista de pedidos claros (2+).
      Si viene vacío y hay necesidad_usuario, PHP lo normaliza a [necesidad_usuario].
  routing_hint:
    type: enum
    values: catalog/preprocess-routing-hints.yaml
    notes: Lectura del mensaje (capa IA); PHP adjudica el path de decisión.
  tags:
    type: list<string>
    notes: Etiquetas cerradas o extendidas; usadas por triggers del catálogo inteligente.
  extractions:
    type: list<object>
    item_fields:
      span: string
      category: enum
      category_values: catalog/preprocess-extraction-categories.yaml
      synonyms: list<string>
    notes: Máximo 2 synonyms por extracción. Categorías validadas en PHP vía PreprocessExtractionCategoryCatalog.
  intent_ids_hint:
    type: list<string>
    optional: true
    deprecated: true
    notes: >
      No pedido al modelo en el prompt (sin catálogo de intents en contexto).
      PHP lo acepta si viene, valida contra RBAC y lo pasa al match;
      pero el scoring real viene de tags + phrases.
      Campo preservado por compat; no agregar al prompt.
  context_areas:
    type: list<string>
    optional: true
    deprecated: true
    notes: >
      Ignorado por PHP. Las áreas activas se derivan del match → intent → carpeta de dominio.
      No pedir al modelo.

example:
  normalized_text: "¿Voy a tener problemas si llego 10 minutos tarde?"
  necesidad_usuario: "Saber consecuencias de llegar 10 minutos tarde a su cita."
  necesidades_usuario:
    - "Saber consecuencias de llegar 10 minutos tarde a su cita."
  routing_hint: pedido_claro
  tags: [llegar_tarde, scheduling]
  extractions: []
  intent_ids_hint: []
