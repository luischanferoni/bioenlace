# Catálogo único de errores de la API v1. Los clientes muestran `message` tal cual.
# intent: error | warning | info
# Los textos admiten marcadores {nombre} que se completan con los params de la excepción.
errors:
  internal_error:
    http_status: 500
    intent: error
    retryable: true
    message: "Ocurrió un problema inesperado. Intentá nuevamente en unos minutos."
  validation_failed:
    http_status: 422
    intent: error
    retryable: false
    message: "Revisá los datos ingresados."
  unauthenticated:
    http_status: 401
    intent: error
    retryable: false
    message: "Tu sesión expiró. Volvé a iniciar sesión."
  forbidden:
    http_status: 403
    intent: error
    retryable: false
    message: "No tenés permisos para realizar esta acción."
  forbidden_detail:
    http_status: 403
    intent: error
    retryable: false
    default_detail: "No tenés permisos para realizar esta acción."
    message: "{detail}"
  not_found_detail:
    http_status: 404
    intent: error
    retryable: false
    default_detail: "No se encontró lo que buscabas."
    message: "{detail}"
  not_found:
    http_status: 404
    intent: error
    retryable: false
    message: "No se encontró lo que buscabas."
  conflict_detail:
    http_status: 409
    intent: error
    retryable: false
    default_detail: "No se pudo completar la operación por un conflicto."
    message: "{detail}"
  rate_limited_detail:
    http_status: 429
    intent: warning
    retryable: true
    default_detail: "Se realizaron demasiados intentos. Esperá y probá nuevamente."
    message: "{detail}"
  service_unavailable:
    http_status: 503
    intent: error
    retryable: true
    message: "El servicio no está disponible en este momento. Intentá nuevamente más tarde."

