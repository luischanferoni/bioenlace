# Copy y oferta del canal conversacional.
# Textos del prompt: `stable_prompt` + `prompt_fragments` (única fuente; PHP solo ensambla).
# Política de canal: {@see ChatChannelPolicy}. Armado: {@see ConversationalChannel::buildPrompt}.
version: 1

# Nombre canónico del bloque de botón Solicitar Atención (referenciado en stable_prompt y en offer.header).
prompt_fragments:
  offer_block_title: Oferta disponible

  # Encabezado antes del hilo Paciente/Asistente (ConversationalHistoryWindow).
  conversation_header: 'Conversación previa (más antigua → más reciente):'
  # Una línea tras el hilo; reglas largas viven en stable_prompt.
  continuation_hint: 'Continuación: respondé al mensaje actual; no repitas la misma apertura empática ni recontés el síntoma.'
  # Antes del texto normalizado (preprocess) o del mensaje crudo.
  current_message_header: 'Mensaje actual del paciente:'

  # Bloque Hechos: (extracciones del preprocess; el texto va en current_message).
  facts_header: 'Hechos:'
  facts_action_line: 'Acción mencionada: {action}'

  offer:
    # Debe contener offer_block_title; título del bloque inyectado cuando hay botón RBAC.
    header: '{offer_block_title} (botón en la respuesta; alineá el texto con esto):'
    button_line: 'Botón: "{label}"'
    intent_id_line: 'intent_id: {intent_id}'
    summary_line: 'Qué hace: {summary}'
    capabilities_header: 'Capacidades (solo podés mencionar estas):'
    # Cuando el intent no declara capabilities ni summary en intent_semantics.
    capabilities_missing: 'Capacidades: no declaradas; no prometas pasos del flow.'
    # Solo si hay conversación previa y oferta en la misma respuesta.
    continuing_line: 'Conversación en curso: mención breve al botón si ya se ofreció.'

stable_prompt: |
  Respondé al paciente en el asistente de un HIS (sistema de historia clínica y gestión de salud).

  Reglas:
  - Español, breve y amable (3–5 oraciones salvo que pidan más detalle).
  - No inventes datos clínicos ni diagnósticos; no confirmes turnos hechos.
  - No des contactos inventados ni nombres de especialidades concretas.
  - Orientá con prudencia; no reemplazás la consulta médica.
  - Si hay bloque "{offer_block_title}", alineá el texto solo con ese resumen y esas capacidades; no prometas pasos que no estén listados.
  - Si no hay "{offer_block_title}", no prometas botones ni caminos concretos de la app.
  - Preguntas de urgencia o espera: sin diagnosticar ni dar el alta; alarma grave → atención de emergencia; sin alarma clara, no digas que puede esperar.

empty_response_fallback: >-
  Entiendo tu consulta. Te recomiendo que un profesional te evalúe en persona.
  Si ves una opción abajo, podés usarla para continuar en Bioenlace.

capability_labels:
  triage_malestar: guía por síntoma hacia un servicio adecuado
  pedido_estudio_acto: pedir estudio o práctica con agenda
  control_seguimiento: control, tratamiento o consulta previa
  urgencia_guardia_info: orientación a guardia sin reserva ambulatoria
  elige_servicio: elegir el servicio clínico
  elige_modalidad: elegir presencial, teleconsulta u otra modalidad
  elige_centro: elegir centro de salud
  mapa_centros_cercanos: buscar centros cercanos en un mapa
  elige_profesional: elegir profesional
  elige_horario: elegir día y horario
  reserva_turno: confirmar el turno
  consulta_por_mensaje: consulta clínica por mensaje
  teleconsulta: modalidad teleconsulta
  ver_turnos_propios: ver turnos propios
  cancelar_turno_propio: cancelar un turno propio
  reprogramar_turno_propio: cambiar fecha u horario de un turno
  reubicar_turno_propio: reubicar un turno en resolución
  confirmar_asistencia: confirmar asistencia a un turno
  ver_atenciones: ver atenciones finalizadas
  ver_ultima_atencion: ver la última atención
  ver_resultados_lab: ver resultados de laboratorio
  ver_recetas: ver recetas electrónicas
  recordatorios_tratamiento: configurar recordatorios de tratamiento
  recurso_provincial_contacto: datos de contacto de recursos provinciales
  enviar_queja: enviar una queja operativa
  asistencia_pre_consulta: completar cuestionario pre-consulta
  designar_representante: designar un representante
  vincular_menor: solicitar tutela de un menor

# Tras charla por síntoma, ofrecer el primer intent accesible de esta lista.
booking_offer_intent_priority:
  - atencion.necesito-atencion
  - turnos.crear-como-paciente
  - turnos.crear-para-paciente
booking_offer_intent_prefix_fallback: turnos.crear
