intent_id: urgencias.egreso-estructurado-flow
version: 2
shortcut:
  hidden: true
action_name: 'Paciente se retiró'
rbac_route: /api/clinical/emergency-guardia/egreso-formulario

initial: completar_egreso
states:
  completar_egreso:
    label: 'Confirmá fecha/hora del retiro'
    description: 'Fecha y hora del retiro de guardia'
    meta:
      requires:
        - draft.guardia_id
      open_ui:
        action_id: clinical.emergency-guardia.egreso-formulario
        params:
          guardia_id: draft.guardia_id
    type: final
flow_submit:
  action_id: clinical.emergency-guardia.egreso-formulario
  params:
    guardia_id: draft.guardia_id
    fecha_fin: draft.fecha_fin
    hora_fin: draft.hora_fin
    nota_administrativa: draft.nota_administrativa
    modo_egreso: administrativo

