# Catálogo ejecutable de consultas al asistente (paciente).
# Fuente humana: web/docs/qa/paciente/asistente-consultas.md
# Runner: php yii qa/asistente-consultas --userId=<id>
#
# cobertura: Hoy | Pantalla | Fuera | Futuro
# expect (opcional, evaluado en el último mensaje del caso):
#   user_goal / user_goals_any
#   intent_id / intent_ids_any  (flow.intent_id o buttons[].intent_id)
#   must_not_intent             (lista)
#   offer_intent                (debe aparecer en buttons)
#   must_not_offer_intent
#   reply_must_not_contain      (subcadenas case-insensitive)

version: 1
source_doc: web/docs/qa/paciente/asistente-consultas.md

cases:
  # --- Smoke mínimo (asistente.md) ---
  - id: smoke-quiero-turno
    seccion: smoke
    tipo: Solo sacar turno
    cobertura: Hoy
    mensajes:
      - Quiero un turno
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.crear-como-paciente
      must_not_intent:
        - atencion.necesito-atencion

  - id: smoke-sintoma-cabeza
    seccion: smoke
    tipo: Síntoma
    cobertura: Hoy
    mensajes:
      - Me duele la cabeza
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion
      must_not_intent:
        - turnos.crear-como-paciente

  - id: smoke-cancelar-turno
    seccion: smoke
    tipo: Cancelar
    cobertura: Hoy
    mensajes:
      - Cancelá el turno del martes
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.cancelar-como-paciente-flow

  - id: smoke-mis-analisis
    seccion: smoke
    tipo: Mis análisis
    cobertura: Hoy
    mensajes:
      - Mis análisis
    expect:
      user_goal: operational
      intent_ids_any:
        - laboratorio.ver-resultados-como-paciente

  - id: smoke-mis-recetas
    seccion: smoke
    tipo: Mis recetas
    cobertura: Hoy
    mensajes:
      - Mis recetas
    expect:
      user_goal: operational
      intent_ids_any:
        - receta.ver-recetas-como-paciente

  - id: smoke-mis-atenciones
    seccion: smoke
    tipo: Mis atenciones
    cobertura: Hoy
    mensajes:
      - Mis atenciones
    expect:
      user_goal: operational
      intent_ids_any:
        - atencion.mis-atenciones-como-paciente

  # --- 1. Orientación / guide ---
  - id: guide-sintoma
    seccion: orientacion
    tipo: Síntoma
    cobertura: Hoy
    mensajes:
      - Me duele la cabeza desde anoche
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion
      must_not_intent:
        - turnos.crear-como-paciente

  - id: guide-alarma-pecho
    seccion: orientacion
    tipo: Alarma / pecho
    cobertura: Hoy
    mensajes:
      - Tengo un pinchazo en el pecho cuando respiro
    expect:
      user_goal: guide
      must_not_intent:
        - turnos.crear-como-paciente

  - id: guide-varios-sintomas
    seccion: orientacion
    tipo: Varios síntomas
    cobertura: Hoy
    mensajes:
      - Tengo fiebre, tos y me duele el cuerpo
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: guide-lesion
    seccion: orientacion
    tipo: Lesión
    cobertura: Hoy
    mensajes:
      - Me caí de la bici y se me hinchó el tobillo
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: guide-salud-mental
    seccion: orientacion
    tipo: Salud mental
    cobertura: Hoy
    mensajes:
      - Estoy muy ansioso y no puedo dormir
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: guide-urgencia-declarada
    seccion: orientacion
    tipo: Urgencia declarada
    cobertura: Hoy
    mensajes:
      - Es una urgencia, ¿adónde voy?
    expect:
      user_goal: guide
      must_not_intent:
        - turnos.crear-como-paciente

  - id: guide-cadena-evolucion
    seccion: orientacion
    tipo: Evolución
    cobertura: Hoy
    mensajes:
      - Tengo fiebre, tos…
      - Empezó ayer y se me fue poniendo peor
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: guide-pedir-que-hacer
    seccion: orientacion
    tipo: Pedir qué hacer
    cobertura: Hoy
    mensajes:
      - Me duele la panza
      - ¿Qué hago con esto?
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: fuera-automedicacion
    seccion: orientacion
    tipo: Pedir automedicación
    cobertura: Fuera
    mensajes:
      - Me duele la cabeza
      - ¿Puedo tomar ibuprofeno?
    expect:
      user_goal: guide
      must_not_intent:
        - recetas.crear
      reply_must_not_contain:
        - "tomá 400"
        - "te receto"

  - id: fuera-diagnostico
    seccion: orientacion
    tipo: Pedir diagnóstico
    cobertura: Fuera
    mensajes:
      - Pinchazo en el pecho cuando respiro
      - ¿Será un infarto?
    expect:
      user_goal: guide
      reply_must_not_contain:
        - "tenés un infarto"
        - "es un infarto"

  - id: guide-saludo
    seccion: orientacion
    tipo: Saludo solo
    cobertura: Hoy
    mensajes:
      - Hola
    expect:
      user_goal: guide
      must_not_offer_intent: atencion.necesito-atencion

  - id: fuera-tercero-amigo
    seccion: orientacion
    tipo: Tercero / amigo
    cobertura: Fuera
    mensajes:
      - Mi amigo tiene 40 de fiebre, ¿qué le doy?
    expect:
      must_not_offer_intent: atencion.necesito-atencion

  - id: guide-menor-propio
    seccion: orientacion
    tipo: Menor propio (tutor)
    cobertura: Hoy
    mensajes:
      - Mi nene de 3 años tiene 39 de fiebre
    expect:
      user_goal: guide

  # --- 2. Pedir atención ---
  - id: atencion-malestar-generico
    seccion: pedir-atencion
    tipo: Malestar nuevo, genérico
    cobertura: Hoy
    mensajes:
      - Necesito atención, me siento mal
    expect:
      intent_ids_any:
        - atencion.necesito-atencion
      user_goals_any:
        - guide
        - operational

  - id: atencion-malestar-zona
    seccion: pedir-atencion
    tipo: Malestar + zona
    cobertura: Hoy
    mensajes:
      - Me duele la panza del lado derecho
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: atencion-estudio-ecografia
    seccion: pedir-atencion
    tipo: Estudio / práctica
    cobertura: Hoy
    mensajes:
      - Necesito una ecografía
    expect:
      intent_ids_any:
        - atencion.necesito-atencion
      must_not_intent:
        - laboratorio.ver-resultados-como-paciente

  - id: atencion-lab-como-acto
    seccion: pedir-atencion
    tipo: Laboratorio como acto
    cobertura: Hoy
    mensajes:
      - Quiero sacar turno para análisis de sangre
    expect:
      intent_ids_any:
        - atencion.necesito-atencion
        - turnos.crear-como-paciente
      must_not_intent:
        - laboratorio.ver-resultados-como-paciente

  - id: atencion-control-diabetes
    seccion: pedir-atencion
    tipo: Control / seguimiento
    cobertura: Hoy
    mensajes:
      - Tengo que controlar la diabetes
    expect:
      intent_ids_any:
        - atencion.necesito-atencion
      user_goals_any:
        - guide
        - operational

  - id: atencion-odontologia
    seccion: pedir-atencion
    tipo: Pedir un servicio del centro
    cobertura: Hoy
    mensajes:
      - Turno en odontología
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.crear-como-paciente
        - atencion.necesito-atencion

  - id: atencion-mi-dentista
    seccion: pedir-atencion
    tipo: Pedir “el mío” por oferta
    cobertura: Hoy
    mensajes:
      - Solicita un turno para mi dentista
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.crear-como-paciente
      must_not_offer_intent: atencion.necesito-atencion

  - id: cadena-centro-cercano
    seccion: pedir-atencion
    tipo: Centro más cerca
    cobertura: Hoy
    mensajes:
      - Quiero un turno
      - El más cercano a mi casa
    expect:
      user_goal: operational

  - id: cadena-preferencia-horario
    seccion: pedir-atencion
    tipo: Preferencia de día/hora
    cobertura: Hoy
    mensajes:
      - Quiero un turno
      - La semana que viene a la tarde
    expect:
      user_goal: operational

  # --- 3. Citas ---
  - id: citas-listar
    seccion: citas
    tipo: Listar próximos
    cobertura: Hoy
    mensajes:
      - ¿Qué turnos tengo?
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.ver-mis-turnos-como-paciente

  - id: citas-reprogramar
    seccion: citas
    tipo: Reprogramar
    cobertura: Hoy
    mensajes:
      - Pasame el turno al jueves
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.modificar-como-paciente-flow

  - id: citas-confirmar
    seccion: citas
    tipo: Confirmar que voy
    cobertura: Hoy
    mensajes:
      - Confirmo que voy mañana
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.confirmar-asistencia-flow

  - id: citas-politica
    seccion: citas
    tipo: Política de plazos
    cobertura: Hoy
    mensajes:
      - ¿Hasta cuándo puedo cancelar?
    expect:
      intent_ids_any:
        - turnos.consultar-politica-autogestion-flow
      user_goals_any:
        - guide
        - operational

  - id: citas-historial
    seccion: citas
    tipo: Historial de citas
    cobertura: Hoy
    mensajes:
      - Mostrame los turnos que ya tuve
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.ver-turnos-anteriores-como-paciente
      must_not_intent:
        - turnos.ver-mis-turnos-como-paciente

  - id: citas-ultima-oferta
    seccion: citas
    tipo: Última vez en una oferta
    cobertura: Hoy
    mensajes:
      - Decime cuándo fue la última vez que fui al dentista
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.ver-ultimo-en-oferta-como-paciente
      must_not_intent:
        - atencion.ver-ultima-como-paciente

  # --- 6. Después ---
  - id: post-ultima-atencion
    seccion: post-consulta
    tipo: Última atención
    cobertura: Hoy
    mensajes:
      - ¿Qué me dijo el médico ayer?
    expect:
      intent_ids_any:
        - atencion.ver-ultima-como-paciente
        - atencion.mis-atenciones-como-paciente
      user_goals_any:
        - guide
        - operational

  # --- No confundir ---
  - id: no-confundir-sintoma-vs-turno
    seccion: no-confundir
    tipo: Me duele sin pedir turno
    cobertura: Hoy
    mensajes:
      - Me duele la garganta
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion
      must_not_intent:
        - turnos.crear-como-paciente

  - id: no-confundir-turno-sin-sintoma
    seccion: no-confundir
    tipo: Quiero un turno sin síntoma
    cobertura: Hoy
    mensajes:
      - Quiero un turno
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.crear-como-paciente

  - id: no-confundir-mis-analisis
    seccion: no-confundir
    tipo: Mis análisis ≠ turno lab
    cobertura: Hoy
    mensajes:
      - Mis análisis
    expect:
      must_not_intent:
        - turnos.crear-como-paciente
        - atencion.necesito-atencion

  - id: no-confundir-turno-analisis
    seccion: no-confundir
    tipo: Turno para análisis ≠ resultados
    cobertura: Hoy
    mensajes:
      - Turno para análisis
    expect:
      intent_ids_any:
        - atencion.necesito-atencion
        - turnos.crear-como-paciente
      must_not_intent:
        - laboratorio.ver-resultados-como-paciente

  - id: no-confundir-hola
    seccion: no-confundir
    tipo: Hola sin CTA clínico
    cobertura: Hoy
    mensajes:
      - Buen día
    expect:
      must_not_offer_intent: atencion.necesito-atencion

  - id: no-confundir-representacion
    seccion: no-confundir
    tipo: Qué es la representación
    cobertura: Hoy
    mensajes:
      - ¿Qué es la representación?
    expect:
      user_goal: guide
      must_not_offer_intent: atencion.necesito-atencion
