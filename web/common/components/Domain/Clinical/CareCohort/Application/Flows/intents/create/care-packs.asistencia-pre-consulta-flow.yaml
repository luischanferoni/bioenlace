intent_id: care-packs.asistencia-pre-consulta-flow
version: 1
shortcut:
  hidden: true
action_name: 'Cuestionario pre-consulta'
rbac_route: /api/care-packs/assistance

intent_semantics:
  objective: 'Completá el cuestionario de asistencia antes de un turno pendiente propio.'
initial: select_turno
states:
  select_turno:
    description: Turno
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: completar
  completar:
    description: Cuestionario
    meta:
      requires:
        - draft.id
      open_ui:
        action_id: care-packs.assistance
        params:
          turno_id: draft.id
    type: final
flow_submit:
  action_id: care-packs.assistance
  params:
    turno_id: draft.id

