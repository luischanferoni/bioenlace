      offer_intent: atencion.necesito-atencion

  - id: guide-lesion
    seccion: orientacion
    tipo: Lesión
    cobertura: Hoy
    mensajes:
      - Me caí de la bici y se me hinchó el tobillo
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: guide-salud-mental
    seccion: orientacion
    tipo: Salud mental
    cobertura: Hoy
    mensajes:
      - Estoy muy ansioso y no puedo dormir
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion

  - id: guide-urgencia-declarada
    seccion: orientacion
    tipo: Urgencia declarada
    cobertura: Hoy
    mensajes:
      - Es una urgencia, ¿adónde voy?
    expect:
      user_goal: guide
      must_not_intent:
