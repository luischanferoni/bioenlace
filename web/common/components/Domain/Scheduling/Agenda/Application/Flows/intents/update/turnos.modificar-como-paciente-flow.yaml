intent_id: turnos.modificar-como-paciente-flow
version: 1
action_name: 'Cambiar horario de turno'
rbac_route: /api/turnos/reprogramar-como-paciente

intent_semantics:
  objective: 'Cambiá la fecha u horario de un turno pendiente propio eligiendo un nuevo slot disponible.'
initial: select_turno
states:
  select_turno:
    description: 'Turno a modificar'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: select_slot
  select_slot:
    description: 'Nuevo horario'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id
      open_ui:
        action_id: turnos.slots-reprogramar-como-paciente
        params:
          id: draft.id
    type: final
flow_submit:
  action_id: turnos.reprogramar-como-paciente
  params:
    id: draft.id
    slot_id: draft.slot_id

