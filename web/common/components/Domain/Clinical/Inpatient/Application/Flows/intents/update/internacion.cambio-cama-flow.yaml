intent_id: internacion.cambio-cama-flow
version: 1
shortcut:
  hidden: true
action_name: 'Cambio de cama'
rbac_route: /api/clinical/episode-of-care/by-internacion

guide:
  funcionalidad: 'Permite al staff realizar el cambio de cama de un paciente internado. El flujo abre el formulario para seleccionar la cama destino y especificar el motivo del traslado. El resultado final es el cambio de cama registrado en el sistema.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Cambio de cama registrado con motivo especificado.
    - Actualización de la ubicación del paciente en el mapa de camas.

initial: cambiar_cama
states:
  cambiar_cama:
    label: 'Seleccioná la cama destino y el motivo'
    description: 'Cama destino y motivo del cambio'
    explanation: 'La persona elige cama destino y motivo del cambio.'
    meta:
      tags:
        - cama
        - traslado
        - pase
        - habitacion
      requires:
        - draft.internacion_id
      open_ui:
        action_id: clinical.internacion.cambio-cama-formulario
        params:
          internacion_id: draft.internacion_id
    outcome: 'Termina cuando la persona cambia la cama.'
    type: final
flow_submit:
  action_id: clinical.internacion.cambio-cama-formulario
  params:
    internacion_id: draft.internacion_id
    id_cama: draft.id_cama
    motivo: draft.motivo

