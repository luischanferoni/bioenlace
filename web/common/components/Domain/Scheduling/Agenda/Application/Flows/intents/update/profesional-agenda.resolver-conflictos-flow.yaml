intent_id: profesional-agenda.resolver-conflictos-flow
version: 1
action_name: 'Resolver conflictos de agenda (staff)'
rbac_route: /api/profesional-agenda/resolver-conflictos-flow

initial: select_turno
states:
  select_turno:
    label: Turno con conflicto
    description: 'Turno con conflicto de agenda'
    meta:
      provides:
        - draft.id
      open_ui:
        action_id: profesional-agenda.elegir-conflicto-agenda
    always: select_eleccion
  select_eleccion:
    label: Resolución
    description: 'Forma de resolver el conflicto'
    meta:
      provides:
        - draft.eleccion
      requires:
        - draft.id
      open_ui:
        action_id: profesional-agenda.elegir-resolucion-conflicto-agenda-para-paciente
        params:
          id: draft.id
    type: final
flow_submit:
  action_id: profesional-agenda.resolver-conflictos-flow
  params:
    id: draft.id
    eleccion: draft.eleccion

