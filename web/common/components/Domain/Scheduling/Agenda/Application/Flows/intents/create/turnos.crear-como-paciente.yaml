intent_id: turnos.crear-como-paciente
version: 4
action_name: 'Turno con un especialista'
rbac_route: /api/turnos/crear-como-paciente
keywords:
  - 'turno con'
  - 'turno en'
  - 'cita con'
  - 'cita en'
  - 'turno para mí'
  - 'agendar con'
  - 'reservar con'
intent_semantics:
  # Contexto 2ª IA. El recorrido es states; no duplicar los pasos acá.
  objective: 'Reservar un turno ambulatorio eligiendo oferta del centro, efector, profesional y horario, sin triage de motivo clínico.'
context:
  - tipo_atencion
  - fecha_turno
initial: select_servicio
states:
  select_servicio:
    description: 'Elegir oferta del centro (servicio con agenda)'
    meta:
      provides:
        - draft.id_servicio_asignado
      open_ui:
        action_id: servicios.elegir-acepta-turnos
      hint:
        entity: servicio
        match_property: nombre
    always: select_efector
  select_efector:
    description: 'Elegir centro de salud (incluye cercanos en mapa)'
    meta:
      provides:
        - draft.id_efector
      requires:
        - draft.id_servicio_asignado
      chooser:
        when_user_says_nearby:
          open_ui:
            action_id: efectores.listar-por-servicio-cercano
            params:
              id_servicio: draft.id_servicio_asignado
        otherwise:
          open_ui:
            action_id: efectores.listar-por-servicio
            params:
              id_servicio: draft.id_servicio_asignado
      hint:
        entity: efector
        match_property: nombre
    always: select_profesional
  select_profesional:
    description: 'Elegir profesional (PES) de esa oferta en ese centro'
    meta:
      provides:
        - draft.id_profesional_efector_servicio
      requires:
        - draft.id_efector
        - draft.id_servicio_asignado
      open_ui:
        action_id: profesional-efector-servicio.listar-por-efector-servicio-acepta-turnos
        params:
          id_efector: draft.id_efector
          id_servicio: draft.id_servicio_asignado
      hint:
        entity: profesional
        match_property: nombre
    always: select_dia
  select_dia:
    description: 'Elegir día con cupos disponibles'
    meta:
      provides:
        - draft.fecha_turno
      requires:
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: turnos.slots-dias-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
    always: select_slot
  select_slot:
    description: 'Elegir horario (slot) para cerrar la reserva'
    meta:
      provides:
        - draft.slot_id
      requires:
        - draft.id_profesional_efector_servicio
        - draft.fecha_turno
      open_ui:
        action_id: turnos.slots-disponibles-como-paciente
        params:
          id_servicio: draft.id_servicio_asignado
          id_efector: draft.id_efector
          id_profesional_efector_servicio: draft.id_profesional_efector_servicio
          fecha: draft.fecha_turno
    type: final
flow_submit:
  action_id: turnos.crear-como-paciente
  params:
    slot_id: draft.slot_id
    id_servicio_asignado: draft.id_servicio_asignado
    id_efector: draft.id_efector
    tipo_atencion: draft.tipo_atencion
