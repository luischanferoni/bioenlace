intent_id: receta.ver-recetas-como-paciente
version: 1
action_name: 'Ver mis recetas electrónicas'
rbac_route: /api/clinical/electronic-prescription/mis-recetas-como-paciente

guide:
  funcionalidad: 'Permite al paciente ver sus recetas electrónicas y acceder al detalle de cada una. El flujo presenta el listado de prescripciones y permite navegar al detalle con posología y dispensa. El resultado final es la visualización de la receta seleccionada.'
  # params: derivados automáticamente de states.*.provides y initial
  condiciones_considerar: []
  condiciones_descartar: []
  resultados_posibles:
    - Visualización del listado de recetas electrónicas.
    - Visualización del detalle de una receta con posología.

initial: ver_listado
states:
  ver_listado:
    label: Elegí una receta electrónica
    description: 'Recetas electrónicas de la persona'
    explanation: 'La persona elige una receta electrónica.'
    meta:
      tags:
        - receta
        - recetas
        - prescripcion
        - electronica
        - mis_recetas
      provides:
        - draft.prescription_id
      open_ui:
        action_id: clinical.electronic-prescription.mis-recetas-como-paciente
    always: ver_detalle
  ver_detalle:
    label: Detalle de la receta
    description: 'Detalle de la receta'
    explanation: 'La persona elige detalle de la receta.'
    meta:
      tags:
        - prescripcion
        - posologia
        - farmacia
        - dispensa
      requires:
        - draft.prescription_id
      open_ui:
        action_id: clinical.electronic-prescription.ver-receta-como-paciente
        params:
          prescription_id: draft.prescription_id
    outcome: 'Termina cuando la persona ve la receta.'
    type: final

