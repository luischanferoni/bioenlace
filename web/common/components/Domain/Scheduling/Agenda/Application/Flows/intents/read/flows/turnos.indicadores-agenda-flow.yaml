intent_id: turnos.indicadores-agenda-flow
version: 1
action_name: 'Indicadores de agenda'
rbac_route: /api/home/panel
keywords:
  - 'indicadores agenda'
  - 'no show'
  - 'ausentismo turnos'
  - 'tiempo hasta cita'
  - 'métricas turnos'
  - 'kpi agenda'
initial: consultar_indicadores
states:
  consultar_indicadores:
    description: 'Período y filtros de agenda'
    meta:
      provides:
        - draft.fecha_desde
        - draft.fecha_hasta
        - draft.id_profesional_efector_servicio
      open_ui:
        action_id: turnos.indicadores-agenda
    type: final
flow_submit:
  action_id: turnos.indicadores-agenda
  params:
    fecha_desde: draft.fecha_desde
    fecha_hasta: draft.fecha_hasta
    id_profesional_efector_servicio: draft.id_profesional_efector_servicio
