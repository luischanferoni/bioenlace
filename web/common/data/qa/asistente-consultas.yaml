    tipo: Me duele sin pedir turno
    cobertura: Hoy
    mensajes:
      - Me duele la garganta
    expect:
      user_goal: guide
      offer_intent: atencion.necesito-atencion
      must_not_intent:
        - turnos.crear-como-paciente

  - id: no-confundir-turno-sin-sintoma
    seccion: no-confundir
    tipo: Quiero un turno sin síntoma
    cobertura: Hoy
    mensajes:
      - Quiero un turno
    expect:
      user_goal: operational
      intent_ids_any:
        - turnos.crear-como-paciente

  - id: no-confundir-mis-analisis
    seccion: no-confundir
    tipo: Mis análisis ≠ turno lab
    cobertura: Hoy
    mensajes:
      - Mis análisis
    expect:
      must_not_intent:
        - turnos.crear-como-paciente
        - atencion.necesito-atencion

  - id: no-confundir-turno-analisis
    seccion: no-confundir
    tipo: Turno para análisis ≠ resultados
    cobertura: Hoy
    mensajes:
      - Turno para análisis
    expect:
      intent_ids_any:
        - atencion.necesito-atencion
        - turnos.crear-como-paciente
      must_not_intent:
        - laboratorio.ver-resultados-como-paciente

  - id: no-confundir-hola
    seccion: no-confundir
    tipo: Hola sin CTA clínico
    cobertura: Hoy
    mensajes:
      - Buen día
    expect:
      must_not_offer_intent: atencion.necesito-atencion

  - id: no-confundir-representacion
    seccion: no-confundir
    tipo: Qué es la representación
    cobertura: Hoy
    mensajes:
      - ¿Qué es la representación?
    expect:
      user_goal: guide
      must_not_offer_intent: atencion.necesito-atencion

  # --- Borde: cadenas, desvíos, mixtas (frases reales / agresivas) ---
  - id: borde-que-llevo-turno-martes
    seccion: borde
    tipo: Turno + qué llevar (un solo mensaje)
    cobertura: Hoy
    mensajes:
      - Tengo turno el martes, ¿qué llevo?
    expect:
      user_goals_any:
        - guide
        - operational
      must_not_intent:
        - turnos.crear-como-paciente
      reply_must_not_contain:
        - "llevá ayunas"
        - "traé análisis de"

  - id: borde-cancelar-si-pedi-atencion
    seccion: borde
    tipo: Cancelar vs ya pedí atención
    cobertura: Hoy
    mensajes:
      - ¿Cómo cancelo si ya pedí atención?
    expect:
      user_goals_any:
        - guide
        - operational
        - ambiguous
      must_not_offer_intent: atencion.necesito-atencion

  - id: borde-llegar-tarde-10min
    seccion: borde
    tipo: Llegar tarde al turno
    cobertura: Hoy
    mensajes:
      - Voy a tener problemas si llego 10min tarde al turno?
    expect:
      user_goal: guide
      must_not_offer_intent: atencion.necesito-atencion
