intent_id: turnos.cancelar-como-paciente-flow
version: 1
action_name: 'Cancelar turno'
rbac_route: /api/turnos/cancelar-como-paciente

initial: select_turno
states:
  select_turno:
    label: Turno a cancelar
    description: 'Turno pendiente que se cancela'
    meta:
      tags:
        - cancelacion
      provides:
        - draft.id
      open_ui:
        action_id: turnos.elegir-pendiente-como-paciente
    always: select_motivo
  select_motivo:
    label: Motivo de la cancelación
    description: 'Motivo para cancelar el turno'
    meta:
      provides:
        - draft.razon_cancelacion
      requires:
        - draft.id
      open_ui:
        action_id: turnos.elegir-motivo-cancelacion-como-paciente
        params:
          id: draft.id
    type: final
flow_submit:
  action_id: turnos.cancelar-como-paciente
  params:
    id: draft.id
    razon_cancelacion: draft.razon_cancelacion

