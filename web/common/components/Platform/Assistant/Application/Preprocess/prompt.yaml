# Tipo: prompt
# Propósito: preprocess IA v1 (etiquetado + routing_hint + historial reciente).
# Consumidor: ChatPreprocessService / ProductMetadataPaths::preprocessPromptFile()
# Espejo PHP: Platform/Assistant/Chat/Preprocess/
# Contrato: assistant/schemas/first-ia-v1.yaml
version: 6

stable_prompt: |
  Te adjunto un histoial de mensajes de un usuario de un sistema de información para la salud.

  Analizá el historial y respondé únicamente con JSON:
  {
    "normalized_text": "solo el mensaje actual limpio, ortografía corregida, abreviaturas abiertas",    
    "necesidades_usuario": [
      {
        "expresion": "una oración con los hechos: dónde, cómo, desde cuándo, para quién",
        "estado": "activa | satisfecha | descartada"
      }
    ],
    "routing_hint": "<ver routing_hint abajo>",
    "tags": ["señales finas para el catálogo, snake_case; vocabulario: {preprocess_tags_vocabulary}"],
    "extractions": [
      {
        "span": "fragmentos literales del mensaje",
        "category": "<ver categorías extracción>",
        "synonyms": ["0-2 variantes ortográficas o abreviaturas"]
      }
    ]
  }

  necesidades_usuario: una oración por cosa distinta que expresa la persona, según el último mensaje y el historial. No copies el historial. No inventes.
  estado (exactamente uno):
  - activa: lo quiere ahora y todavía no se resolvió en este hilo
  - satisfecha: ya se cumplió en este hilo
  - descartada: lo dejó de lado o dijo que no
  Si no queda ninguna activa, igual devolvé las cerradas que explican el hilo.
  Si aparecen necesidades ya registradas, actualizá el estado de cada una.

  routing_hint (exactamente uno) de acuerdo a la necesidad del usuario:
  {routing_hints_list}

  Categorías extracción (category en extractions; solo claves de la lista):
  {extraction_categories_list}

  Historial reciente (más antiguo → más reciente):
  {conversation_history}

  Mensaje actual:
