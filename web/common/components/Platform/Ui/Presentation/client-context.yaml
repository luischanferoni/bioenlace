# Tipo: manifest
# Propósito: reglas de contexto cliente web vs móvil (app_client_ids, shortcuts).
# Consumidor: ClientContextMetadata / ProductMetadataPaths::clientContextFile()
# No poner aquí: intents de paciente hardcodeados en Platform.
version: 1

mobile_paciente:
  app_client_ids:
    - paciente-flutter
  shortcut_display:
    mode: rbac
    omit_subgroups: true

whatsapp_paciente:
  app_client_ids:
    - whatsapp-paciente
  shortcut_display:
    mode: rbac
    omit_subgroups: true

web_staff:
  # El top menu (Efector → Servicio → Encounter Type) se muestra siempre: ningún rol lo oculta.
  hide_servicio_navbar_roles: []

  hide_paciente_flows:
    intent_ids:
      - atencion.necesito-atencion
      - care-packs.asistencia-pre-consulta-flow
    intent_id_contains:
      - como-paciente
      - '-paciente-'
    rbac_route_contains:
      - como-paciente

  hide_notification_tipos:
    - TURNO_REQUIERE_REUBICACION
    - TURNO_CANCELADO_EFECTOR
    - TURNO_RECORDATORIO
    - TURNO_CONFIRMAR
    - TURNO_TRANSPORT_HINT
    - TURNO_REMINDER
